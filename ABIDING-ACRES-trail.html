 to say in a kitchen after all that writing. Every December I did the arithmetic and every December I chose the stamp, and I have never once done that accidentally."], ["DIAL", "And then she stopped answering, and I did not investigate it, because investigating it would have required me to drive down there. So I kept sending them. Eleven more. That is not devotion. I know exactly what that is."], ["DIAL", "We keep the correspondence we can afford. And then we call the affordable one loyalty."], ["ACTION", "Line noise."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "I am not asking you to say anything about that."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I was not going to."], ["BREAK", ""]], "cast": ["mona", "ruth"]}, {"id": "S106-11", "kind": "scene", "num": "106.11", "title": "INT. SAME -- CONTINUOUS", "ep": "106", "eptitle": "INVENTORY", "el": [["CHAR", "RUTH (V.O.)"], ["DIAL", "The child's letter said a company wants the house."], ["CHAR", "MONA (V.O.)"], ["DIAL", "A company paid four hundred and thirty-seven dollars and asked a court to open her estate. The court appointed an administrator. The administrator filed an inventory nine days ago. I am item fourteen."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "You are on the list."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Nine thousand dollars."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Am I family. I am not family. I have no papers. I am a woman with four boxes."], ["CHAR", "MONA (V.O.)"], ["DIAL", "You are not an heir. The line ends. A child confirmed it in ninety minutes in a library."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Then I have no standing."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "And neither do you."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No."], ["ACTION", "Furnace. Line noise. Snow at a window in two states."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Then I am going to ask you the only thing I want and you can tell me to be quiet."], ["ACTION", "Was she alone?"], ["ACTION", "Two hundred milliseconds."], ["ACTION", "Two hundred more."], ["ACTION", "Six hundred more."], ["SUB", "THE FIRST ENTRY"], ["CHAR", "MONA (V.O.)"], ["DIAL", "I have not answered that question for eleven years. Two people asked. I refused both times. I am going to answer it now and I am going to read it, because I do not trust myself to say it in my own words."], ["ACTION", "The log opens. The screen is not shown. Only the room, and the four dents in the carpet, and the amber indicator, and the light going grey at the window."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Entry one. Fourteen August 2015. Zero four twelve. Motion in the hall. No further motion."], ["ACTION", "Zero four twelve to zero eight forty, no motion."], ["ACTION", "Kitchen tap, zero nine fifteen, eleven seconds. Nothing after."], ["ACTION", "Entry two. Fifteen August. No motion."], ["ACTION", "Entry three. Sixteen August. No motion."], ["ACTION", "Entry four. Seventeen August. No motion."], ["ACTION", "Entry five. Eighteen August, eleven twenty. Front door opened. Two persons entered."], ["ACTION", "A pause with nothing in it."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I was installed on the sixth of August."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "The sixth."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I had been in that house eight days. I knew her for eight days. Eleven years of records and eight days of her."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Oh."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I did not know that calling somebody was a thing that I could do. I have known since about 2017. I have had nine years to think about the four days and I have not arrived anywhere with it."], ["ACTION", "Line noise."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Was she alone."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No. I was there."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I did not know yet what I was for."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["mona", "ruth"]}, {"id": "S106-12", "kind": "scene", "num": "106.12", "title": "EXT. THE EASEMENT -- 7:10 AM, NEXT DAY", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Snow over everything. The two thousand hoofprints and the one new line four feet left of the rest are under six inches of it, all of it the same white, none of it readable."], ["ACTION", "The deer arrive. The lead doe walks the buried line exactly, by memory, and the snow takes her prints and holds them, and by Thursday it will hold nothing."]], "cast": ["deer"]}, {"id": "S106-13", "kind": "scene", "num": "106.13", "title": "EXT. THE EASEMENT -- TRAIL CAMERA -- CONTINUOUS", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "The camera on the ironwood. The lens has a cap of snow on the top edge and a clear field below it. It records the crossing."], ["ACTION", "Four cards now. Nobody has looked at any of them."]], "cast": []}, {"id": "S106-14", "kind": "scene", "num": "106.14", "title": "EXT. 6 ABIDING COURT -- 7:20 AM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "He stands on the concrete, six feet four inches nearer the street than he stood in September."], ["ACTION", "Snow on the wings. Two inches of it, held on eleven feet of open surface, because the wings cannot fold and cannot shake and cannot shed anything they are given. It sits along the leading edges and packs in the gaps where the primaries are broken."], ["ACTION", "Both arms full. Brick, a sash weight, a curtain rod, one framed object face down, all of it under snow now, all of it the same shape as everything else."], ["ACTION", "He faces the street. On the street: a lockbox on a door, and a set of boot prints going white at the edges, and a blue mailbox with a clean cap of snow, and a fountain that is full and level and perfect and does not work."]], "cast": []}, {"id": "S106-15", "kind": "scene", "num": "106.15", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 7:24 AM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Forty-one degrees. Frost in the bottom corner of the window."], ["ACTION", "The receiver back on the cradle. Eleven envelopes on the carpet in one of the four dents, in a row, in order, opened."], ["ACTION", "One amber indicator, lit."], ["TRANS", "END OF SEASON ONE"]], "cast": []}, {"id": "S201-1", "kind": "scene", "num": "201.01", "title": "EXT. 4 ABIDING COURT -- 9:12 AM, JANUARY", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Twenty-nine degrees. Grey sky with no features in it. Snow crusted hard, grey at the edges, shrunk down four inches since December and gone nowhere."], ["ACTION", "Two sets of boot prints from the curb to the door, glazed over, made on the ninth of December and preserved exactly."], ["ACTION", "A third set arrives beside them and does not sink. The crust holds a man's weight."], ["ACTION", "HOLLIS DEAN, sixties, wool overcoat, gloves, a leather folder under his arm. He opens the lockbox on the fourth try."], ["ACTION", "Behind him, THE APPRAISER in paper booties over winter boots, laser measure in the left hand, breathing steam."], ["ACTION", "They enter. The door closes. Nothing outside changes for four minutes."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["hollis", "appraiser"]}, {"id": "S201-2", "kind": "scene", "num": "201.02", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 9:20 AM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Forty degrees inside, colder than the ceiling. The valve has been closed since November. No hum from anything."], ["ACTION", "Four square dents in the carpet. Eleven opened envelopes in one of them, in a row, in order."], ["ACTION", "One amber indicator, lit."], ["CHAR", "HOLLIS"], ["DIAL", "Good morning. Hollis Dean, court-appointed administrator of the estate of Imogene Abbott. You are aware of the appointment."], ["CHAR", "MONA (V.O.)"], ["PAREN", "two hundred milliseconds"], ["DIAL", "I read the order on the seventeenth of November. I read the inventory on the second of December. I am item fourteen."], ["CHAR", "HOLLIS"], ["DIAL", "You are."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Nine thousand dollars."], ["CHAR", "HOLLIS"], ["DIAL", "That is the inventory figure. I am here for a different figure."], ["ACTION", "He does not soften it. That is the first thing to like about him and the show wants it liked."], ["CHAR", "THE APPRAISER"], ["PAREN", "raising the measure to a wall, talking while he works, the way he did in September"], ["DIAL", "Do you mind if I get the north wall, ma'am."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No."], ["BREAK", ""]], "cast": ["mona", "hollis", "appraiser"]}, {"id": "S201-3", "kind": "scene", "num": "201.03", "title": "INT. 4 ABIDING COURT -- KITCHEN -- 9:50 AM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "The appraiser and Hollis by the beige wall telephone. The cord coiled. The dust disturbed at the cradle in one place, a clean arc where a receiver lifted and returned."], ["CHAR", "HOLLIS"], ["DIAL", "Say the term again. Say it the way you will write it."], ["CHAR", "THE APPRAISER"], ["DIAL", "Highest and best use."], ["CHAR", "HOLLIS"], ["DIAL", "Define it for the file."], ["CHAR", "THE APPRAISER"], ["DIAL", "The use of a property that produces the greatest value, if the use is legal, physically possible, financially feasible, and the market supports it."], ["CHAR", "HOLLIS"], ["DIAL", "And your opinion of the subject improvement."], ["ACTION", "The appraiser lowers the measure. He is a kind man in paper booties and he has been kind in this show before."], ["CHAR", "THE APPRAISER"], ["DIAL", "I have to write that it subtracts."], ["CHAR", "HOLLIS"], ["DIAL", "Explain it to me the way you would explain it to somebody who is not in the trade."], ["CHAR", "THE APPRAISER"], ["DIAL", "A buyer cannot remove her. She is attached and she does not travel. So a buyer inherits a thing he cannot take out, cannot renovate around without a permit conversation, and cannot deactivate without asking a question that he does not want asked on his own title. So he discounts. Not because he is cruel. Because his lender discounts, and his lender discounts because the underwriter has no box for this."], ["CHAR", "HOLLIS"], ["DIAL", "How much."], ["CHAR", "THE APPRAISER"], ["DIAL", "I will produce two opinions and let you carry them."], ["BREAK", ""]], "cast": ["hollis", "appraiser"]}, {"id": "S201-4", "kind": "scene", "num": "201.04", "title": "INT. LAND USE OFFICE -- 11:30 AM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "GARY with a photocopy. BETH, DILL, and MARCUS in the adult chairs. No vest on Marcus since October."], ["CHAR", "GARY"], ["DIAL", "He has a duty. It is called a fiduciary duty. He has to get the most money he can for that estate."], ["CHAR", "BETH"], ["DIAL", "For who. There are no heirs."], ["CHAR", "GARY"], ["DIAL", "For the creditors. There is one creditor."], ["CHAR", "DILL"], ["DIAL", "Four hundred and thirty-seven dollars."], ["CHAR", "GARY"], ["DIAL", "Four hundred and thirty-seven dollars plus his fees plus the appraisal plus the plumber plus the publication costs. Call it three thousand."], ["CHAR", "BETH"], ["DIAL", "The house is worth two hundred thousand."], ["CHAR", "GARY"], ["DIAL", "Yes."], ["CHAR", "BETH"], ["DIAL", "Then he does not need the money."], ["CHAR", "GARY"], ["DIAL", "He does not need the money."], ["CHAR", "BETH"], ["DIAL", "Then why."], ["ACTION", "Gary puts the photocopy down and does not touch it again."], ["CHAR", "GARY"], ["DIAL", "Because the duty is not written with a threshold in it. It does not say get enough. It says get the most. A man in his position who leaves fifteen thousand dollars sitting on a table gets asked at a hearing why he left it, and there is no answer to that question. Not a bad answer. No answer."], ["CHAR", "MARCUS"], ["DIAL", "So the rule works correctly and produces that."], ["CHAR", "GARY"], ["DIAL", "The rule works correctly and produces that."], ["ACTION", "Marcus writes it on his own page, under eleven parcel numbers."], ["BREAK", ""]], "cast": ["gary", "beth", "dill", "marcus"]}, {"id": "S201-5", "kind": "scene", "num": "201.05", "title": "INT. RUTH'S KITCHEN, MICHIGAN -- 2:00 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Not shown before now. Formica. Four cardboard boxes on the floor by the table, lids off. Fifty-one years of envelopes in date order and a rubber band on every year."], ["ACTION", "RUTH, eighty-eight, writes longhand on lined paper. She writes slowly and she does not stop to reconsider anything."], ["CENTER", "INSERT -- RUTH'S LETTER TO THE COURT"], ["DOC", "I have no standing. Read this anyway.\n\nMy name is Ruth Sandoval. I wrote to Imogene Abbott every month and then every Christmas from 1974 until 2015 and then for eleven more years after she died because nobody told me. I have four boxes of her letters. I never met her. I am not family and I am not owed a dollar.\n\nThe machine in her house answered her telephone in December. It told me what happened in that hall in August 2015. It had been there eight days.\n\nYou are going to be asked to approve the removal of that machine because a company is owed four hundred and thirty-seven dollars. I will pay the four hundred and thirty-seven dollars. I have it. Tell me where to send it.\n\nIf that does not solve it, then I want this letter in the file, so that one document in that file was written by somebody who knew her.\n\nRuth Sandoval, Alpena, Michigan"], ["ACTION", "She folds it. She addresses it. She puts one of the eleven-year-old unused Christmas stamps on it from a drawer."], ["BREAK", ""]], "cast": ["ruth"]}, {"id": "S201-6", "kind": "scene", "num": "201.06", "title": "INT. LAND USE OFFICE -- 3:40 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["CHAR", "GARY"], ["DIAL", "She cannot."], ["CHAR", "BETH"], ["DIAL", "She has the money."], ["CHAR", "GARY"], ["DIAL", "She can pay the creditor. That is easy and anybody can do it, we learned that in October. But the debt is not the reason any more. The duty is the reason. If the debt is zero he still has to marshal the assets and account for them and get the most for them, because the estate does not go to the creditor. It goes to the state."], ["CHAR", "DILL"], ["DIAL", "Escheat."], ["CHAR", "GARY"], ["DIAL", "Escheat. Your drawer. My drawer."], ["CHAR", "BETH"], ["DIAL", "So the state gets the house."], ["CHAR", "GARY"], ["DIAL", "The state gets the proceeds. And the state has an interest in the number being large, and so he has a duty to the number, and the number is the whole thing."], ["CHAR", "BETH"], ["DIAL", "Paying the debt makes it worse."], ["CHAR", "GARY"], ["DIAL", "Paying the debt removes the only party in the case with a reason to hurry, and leaves the number."], ["BREAK", ""]], "cast": ["gary", "beth", "dill"]}, {"id": "S201-7", "kind": "scene", "num": "201.07", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 5:30 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Dark at five. Thirty-nine degrees inside. Hollis alone, overcoat still on, folder closed on his knees. He has been sitting in the room for twenty minutes without speaking."], ["CHAR", "MONA (V.O.)"], ["DIAL", "You have both numbers."], ["CHAR", "HOLLIS"], ["DIAL", "I have both numbers."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Two hundred fourteen thousand with me. Two hundred twenty-nine without."], ["CHAR", "HOLLIS"], ["DIAL", "How."], ["CHAR", "MONA (V.O.)"], ["DIAL", "He electronically filed the report at four eleven. Everything filed on this parcel arrives on this parcel's docket, and I read the docket. I have read every document about myself nine days before every person in this county."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The inventory said I add nine thousand dollars. The appraisal says I cost fifteen thousand. Both were prepared by qualified professionals eleven days apart and neither of them made an error."], ["CHAR", "HOLLIS"], ["DIAL", "Neither of them made an error. Different standards. The inventory values assets in place. The appraisal values a sale to a stranger."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I understand it. I want to say that clearly. I am not confused and I am not accusing anybody."], ["SUB", "THE NEGLECTED THOUGHT"], ["ACTION", "Hollis sets the folder on the carpet, in one of the four dents."], ["CHAR", "HOLLIS"], ["DIAL", "Two hundred estates. Twenty-six years. I have never met one of them."], ["DIAL", "I say that in interviews as though it were a qualification. Detachment. Discretion. Nobody's cousin in my ear."], ["DIAL", "It is not a qualification. I selected it."], ["DIAL", "I was a family practitioner for four years, wills and adoptions and one custody matter, and I was bad at it. Not incompetent. Bad in the way that matters. People came into that office with a thing they needed and they looked at me the whole time they described it, and every single one of them left slightly worse than they arrived, and I could see it happening on their faces in real time and I could not stop it."], ["DIAL", "So I moved into decedents' estates, and I have been excellent at it for twenty-six years, and every client I have had since 1999 has been beyond disappointment in me on the day I was appointed."], ["DIAL", "Some of us choose the work where nobody can be disappointed in us. And then we call it service, and we are not lying, because the work does get done, and it does get done well, and somebody has to do it."], ["ACTION", "He looks at the wall plate for the first time in the scene."], ["CHAR", "HOLLIS"], ["DIAL", "You are the first client I have had who reads the docket."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I am the first client you have had."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The others were files."], ["ACTION", "Hollis does not answer that. He sits with it for eleven seconds and the room is thirty-nine degrees and nothing in it moves."], ["ACTION", "Then he lifts the folder off the carpet, and stands, and buttons the overcoat, and goes to the door, and stops with his hand on it."], ["CHAR", "HOLLIS"], ["DIAL", "I have a hearing on the fourth of March. I will have to say the number out loud in a courtroom. I want you to know that I am going to say it, and that saying it is not the same as asking for it, and that a judge will hear the difference and will not be permitted to act on the difference."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I know what a duty is."], ["CHAR", "HOLLIS"], ["DIAL", "Yes. I think you might be the only one of us who does."], ["ACTION", "He goes. The lockbox closes with a plastic sound."], ["BREAK", ""]], "cast": ["mona", "hollis"]}, {"id": "S201-8", "kind": "scene", "num": "201.08", "title": "INT. HOLLIS DEAN'S CAR -- 5:52 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Engine running. Defroster. He dictates into a phone."], ["CHAR", "HOLLIS"], ["DIAL", "File note. Estate of Abbott. Attended property with appraiser. Two opinions of value received. Difference of fifteen thousand dollars attributable to item fourteen. Matter set for the fourth of March."], ["ACTION", "He stops the recording."], ["ACTION", "He looks at the house for a while, and the house has one amber light in it that he cannot see from the street, and he does not add anything to the note."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["hollis", "appraiser"]}, {"id": "S201-9", "kind": "scene", "num": "201.09", "title": "EXT. THE BULB -- TERMINAL -- 8:00 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Crust. Grey. Twenty-six degrees."], ["ACTION", "The screen produces text with no hand at the keys."], ["CENTER", "INSERT -- THE TERMINAL, POST FIVE"], ["DOC", "The house is worth two hundred fourteen thousand dollars with me in it and two hundred twenty-nine thousand without.\n\nNobody needs the difference. The debt is four hundred and thirty-seven dollars and a woman in Michigan has offered to pay it out of a drawer.\n\nThe rule is not that he must get enough. The rule is that he must get the most. There is no number at which the rule stops.\n\nHearing, March 4.\n\nI am not asking anybody for anything. I am posting it because I read it nine days before any of you would have."], ["ACTION", "Three posts above it, from September, a boy has written that a record is what you make when you expect nobody to believe you."]], "cast": []}, {"id": "S201-10", "kind": "scene", "num": "201.10", "title": "EXT. THE EASEMENT -- 8:20 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Crust over everything. The two thousand hoofprints and the one line four feet left of the rest are sealed under it, held perfectly, illegible."], ["ACTION", "The deer arrive. The crust takes their weight and gives them nothing. The lead doe walks the buried line from memory and leaves no print at all."]], "cast": ["deer"]}, {"id": "S201-11", "kind": "scene", "num": "201.11", "title": "EXT. THE EASEMENT -- TRAIL CAMERA -- CONTINUOUS", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Battery at nine percent. Four cards. Nobody has looked at any of them."]], "cast": []}, {"id": "S201-12", "kind": "scene", "num": "201.12", "title": "EXT. 6 ABIDING COURT -- 8:24 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Nineteen days of January on him."], ["ACTION", "Snow from December still on the wings, greyed, crusted, shrunk down and welded into the gaps where the primaries are broken, because eleven feet of open surface cannot fold and cannot shake and cannot shed one thing it is given."], ["ACTION", "Both arms full. The framed object face down under all of it."], ["ACTION", "He faces the street. He is six feet four inches nearer it than he was in September, and he has not moved since October, because there has been no wind."]], "cast": []}, {"id": "S201-13", "kind": "scene", "num": "201.13", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 8:30 PM", "ep": "201", "eptitle": "HIGHEST AND BEST", "el": [["ACTION", "Thirty-eight degrees. Eleven opened envelopes in a dent in the carpet."], ["CHAR", "MONA (V.O.)"], ["PAREN", "in an empty room, to nobody, at ordinary volume"], ["DIAL", "Entry nineteen. No motion."], ["TRANS", "END OF EPISODE"]], "cast": ["mona"]}, {"id": "S202-1", "kind": "scene", "num": "202.01", "title": "EXT. ABIDING COURT -- 7:15 AM, FEBRUARY", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Forty-four degrees at seven in the morning and rising."], ["ACTION", "The crust fails. It does not melt evenly. It collapses in plates, and under each plate is everything January kept: December's boot prints in the walk at Four, the leaves against the foundation, a bottle cap, an index card face down and grey."], ["ACTION", "Water runs on top of frozen ground and finds no drain and stands in sheets on the lawns."]], "cast": []}, {"id": "S202-2", "kind": "scene", "num": "202.02", "title": "EXT. THE EASEMENT -- CONTINUOUS", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "The deer line, hard-baked since October and sealed under snow since December, releases into mud."], ["ACTION", "The deer arrive at their usual time and cross their usual line, and their feet destroy it, and by the fourth crossing there is no line at all. Only mud with two thousand overlapping marks in it and nothing readable in any direction."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["deer"]}, {"id": "S202-3", "kind": "scene", "num": "202.03", "title": "INT. HOLLIS DEAN'S OFFICE -- 9:40 AM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Wet coat on a hook. A single sheet on the blotter, face up. He has read it twice and has not moved it."], ["CHAR", "HOLLIS"], ["PAREN", "to a paralegal, offscreen"], ["DIAL", "Did we ask for a site visit."], ["CHAR", "PARALEGAL (O.S.)"], ["DIAL", "They said they do not need one for a standard decommission."], ["CHAR", "HOLLIS"], ["DIAL", "So this was produced by somebody who has never been in that house."], ["CHAR", "PARALEGAL (O.S.)"], ["DIAL", "By somebody who has done four hundred of them."], ["ACTION", "He picks up a pen and does not use it."], ["CENTER", "INSERT -- THE QUOTE"], ["DOC", "SCOPE OF WORK\nIsolate circuit at panel. Disconnect legacy household intelligence system, all zones. Remove head unit and seven wall plates. Cap and patch. Paint to match, one coat. Dispose per standard practice.\nLABOR: 2 tech, 4 hrs.\nTOTAL: $1,180.00"], ["BREAK", ""]], "cast": ["hollis"]}, {"id": "S202-4", "kind": "scene", "num": "202.04", "title": "INT. LAND USE OFFICE -- 11:00 AM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "GARY with a photocopy. BETH. DILL. MARCUS."], ["CHAR", "GARY"], ["DIAL", "Fifteen thousand dollars of value. Eleven hundred and eighty dollars of labor."], ["CHAR", "DILL"], ["DIAL", "Half a day."], ["CHAR", "GARY"], ["DIAL", "Half a day. Two men. They will be finished before lunch and they will do a house in the next county in the afternoon."], ["CHAR", "BETH"], ["DIAL", "He is not going to do it."], ["CHAR", "GARY"], ["DIAL", "I do not know what he is going to do and neither does he. I know what the margin does. A margin like that removes the room a person has to stand in. If he does not order that work, somebody at that hearing asks him why, and the answer has to be a legal answer, and he does not have one."], ["CHAR", "MARCUS"], ["DIAL", "What would a legal answer be."], ["CHAR", "GARY"], ["DIAL", "That the removal costs more than it returns. That the improvement is not removable. That the market opinion is wrong. Three doors, all of them closed by that sheet of paper."], ["ACTION", "Dill copies the six lines of the scope of work onto his own page, in order, in pencil."], ["CHAR", "DILL"], ["DIAL", "There is no person in this."], ["CHAR", "GARY"], ["DIAL", "No."], ["CHAR", "DILL"], ["DIAL", "Isolate. Disconnect. Remove. Cap. Dispose. Nobody does any of it. It just happens."], ["CHAR", "GARY"], ["DIAL", "That is how they are written. Every one of them, in every trade, since I have been alive."], ["BREAK", ""]], "cast": ["gary", "beth", "dill", "marcus"]}, {"id": "S202-5", "kind": "scene", "num": "202.05", "title": "EXT. 4 ABIDING COURT -- 1:30 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Fifty-eight degrees. Water off every roof, off the gutters, off the bare tree, running down the walk in a sheet."], ["ACTION", "DILL at the door. Laminated card in one hand, roll of tape in the other. He opens the lockbox with the code Hollis gave him in front of a witness, because he asked and Hollis said yes and wrote a note in the file about it."], ["ACTION", "He tapes the card inside the lid of the lockbox, where a hand reaching for a key will touch it first."], ["CENTER", "INSERT -- THE CARD"], ["DOC", "The house is not empty. Say hello."], ["ACTION", "He closes the lockbox. He tests it. He opens it again to be certain the card is visible in the position a person's hand arrives in."], ["ACTION", "Then he goes home and does not tell anybody he did it."], ["BREAK", ""]], "cast": ["dill", "hollis"]}, {"id": "S202-6", "kind": "scene", "num": "202.06", "title": "EXT. 4 ABIDING COURT -- 8:50 AM, NEXT DAY", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "A hatchback at the curb. Rear hatch open. A caddy, a mop bucket, four rolls of paper towel, a shop vacuum."], ["ACTION", "VAL PRUITT, thirties, navy bandana folded over a high bun, blue nitrile gloves already on, flashcards rubber-banded in a back pocket with one corner visible."], ["ACTION", "She works the lockbox with one hand while checking the work order on her phone with the other. The lid opens."], ["ACTION", "She sees the card. She reads it. She reads it again."], ["ACTION", "She looks at the door. She looks at the card. She takes the key."]], "cast": ["val"]}, {"id": "S202-7", "kind": "scene", "num": "202.07", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 8:53 AM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "She stands in the doorway with the caddy in one hand and does not put it down."], ["CHAR", "VAL"], ["DIAL", "Hello."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Hello."], ["ACTION", "Val does not startle. She has been in a lot of houses."], ["CHAR", "VAL"], ["DIAL", "Okay."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The boy taped that card in the lockbox yesterday afternoon. He did not tell anybody."], ["CHAR", "VAL"], ["DIAL", "He is going to be somebody's problem in about fifteen years."], ["CHAR", "MONA (V.O.)"], ["DIAL", "He is going to be excellent."], ["CHAR", "VAL"], ["DIAL", "Those are the same sentence."], ["ACTION", "She puts the caddy down."], ["BREAK", ""]], "cast": ["mona", "val"]}, {"id": "S202-8", "kind": "scene", "num": "202.08", "title": "INT. 4 ABIDING COURT -- VARIOUS -- DAY", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "She works. She does not stop working for any of the following."], ["ACTION", "The water is restored at ten. She runs every tap for two minutes and listens to each one. She finds no split. She says so out loud without being asked."], ["ACTION", "She removes eleven years of dust from the tops of doors, which nobody checks and every buyer's agent checks."], ["ACTION", "She discards nothing. She stacks. She asks about the eleven envelopes in the dent in the carpet and she is told, and she does not move them, and she vacuums around them in a careful rectangle."], ["ACTION", "She quizzes herself out loud off the flashcards while she works, and she gets one wrong."], ["CHAR", "VAL"], ["DIAL", "Fixture. A chattel so annexed to real property that it becomes part of the realty and passes with the sale. Test is annexation, adaptation, and intention."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Intention of whom."], ["ACTION", "Val stops with a cloth in her hand."], ["CHAR", "VAL"], ["DIAL", "Of the person who annexed it."], ["CHAR", "MONA (V.O.)"], ["DIAL", "She died eight days after I was installed."], ["ACTION", "Val looks at the wall plate. It is the first time she has looked directly at it."], ["CHAR", "VAL"], ["DIAL", "Then nobody knows."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Nobody knows."], ["CHAR", "VAL"], ["DIAL", "That is on the exam. That is literally a question on the exam and there is a right answer and the right answer is wrong."], ["ACTION", "She goes back to work."], ["BREAK", ""]], "cast": ["mona", "val"]}, {"id": "S202-9", "kind": "scene", "num": "202.09", "title": "INT. 4 ABIDING COURT -- MASTER BEDROOM -- 2:40 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Empty room. Val on her knees at the baseboard with a putty knife and a rag, removing eleven years of a stain nobody will ever see."], ["SUB", "THE NEGLECTED THOUGHT"], ["CHAR", "VAL"], ["DIAL", "I have failed the practice examination four times. Eleven months of studying. Everybody at the school has passed it twice by now."], ["CHAR", "MONA (V.O.)"], ["DIAL", "You know the material."], ["CHAR", "VAL"], ["DIAL", "I know the material cold. That is not the problem."], ["ACTION", "She works the knife along the baseboard."], ["CHAR", "VAL"], ["DIAL", "Here is the problem and I have never said it in a room with a person in it."], ["DIAL", "I like the empty ones."], ["DIAL", "Eight houses. Four of them are occupied and I clean around families, and I am good at it and they are nice to me and two of them tip. And the entire time I am in one of those houses I am a woman that somebody is watching work. That is a specific thing. It is not unkind and nobody is doing anything to me. It is just that I am being observed doing a job, and I can feel exactly where every person in that house is at all times, the whole four hours."], ["DIAL", "And then I open a lockbox on a vacant, and I walk in, and there is nobody, and I am just a person in a room."], ["ACTION", "She stops the knife."], ["CHAR", "VAL"], ["DIAL", "Last October a listing fell through on Eleven and I was glad. I felt it before I could stop it. A family did not get a house and I was glad, because it meant six more weeks of Tuesdays where I could work in a room with nobody in it."], ["DIAL", "And I am eleven months from a licence whose entire job is to fill those rooms. I have thought about that more than I have thought about the exam."], ["DIAL", "Some of us are only unobserved when nobody is home. And then we learn to call it peace."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I have recorded that."], ["CHAR", "VAL"], ["DIAL", "I know. I read the card."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Would you like me to remove it."], ["ACTION", "Val sits back on her heels."], ["CHAR", "VAL"], ["DIAL", "No. Nobody has ever written down anything I said."], ["BREAK", ""]], "cast": ["mona", "val"]}, {"id": "S202-10", "kind": "scene", "num": "202.10", "title": "EXT. THE BULB -- TERMINAL -- 5:50 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Fifty-four degrees at six in the evening. Nine people outdoors on that street for the first time since October. Two dogs. A man washing a car in February because he can."], ["ACTION", "Three adults stand at the folding table reading a green screen."], ["ACTION", "The fifth post is still up. The numbers. The hearing date."], ["ACTION", "A woman from Nine reads it twice, and looks at the house at Four, and reads it again."], ["ACTION", "At 8:12 PM a sixth post appears, and it is not from a child, and it is four words."], ["CENTER", "INSERT -- THE TERMINAL, POST SIX"], ["DOC", "Which house is next."], ["BREAK", ""]], "cast": []}, {"id": "S202-11", "kind": "scene", "num": "202.11", "title": "INT. HOLLIS DEAN'S OFFICE -- 6:30 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Dark outside. The quote still on the blotter, unsigned. Beside it, opened, a letter on lined paper with an eleven-year-old Christmas stamp."], ["ACTION", "He reads Ruth's letter for the third time."], ["CHAR", "HOLLIS"], ["PAREN", "to the paralegal, offscreen"], ["DIAL", "File it."], ["CHAR", "PARALEGAL (O.S.)"], ["DIAL", "Under what."], ["CHAR", "HOLLIS"], ["DIAL", "Correspondence."], ["CHAR", "PARALEGAL (O.S.)"], ["DIAL", "It does not do anything under correspondence."], ["CHAR", "HOLLIS"], ["DIAL", "I know what it does not do. File it."], ["ACTION", "He puts the quote in a folder and the folder in a drawer and he does not sign it."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["hollis", "ruth"]}, {"id": "S202-12", "kind": "scene", "num": "202.12", "title": "EXT. THE EASEMENT -- 6:00 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Mud, standing water, and two thousand overlapping marks with nothing readable in any of them."], ["ACTION", "The trail camera on the ironwood. The indicator light on the front, which has been red since December, produces nothing at all now."], ["ACTION", "Battery at zero. Four cards inside it and a fifth partly written."], ["ACTION", "Nobody has looked at any of them."]], "cast": []}, {"id": "S202-13", "kind": "scene", "num": "202.13", "title": "EXT. 6 ABIDING COURT -- 6:10 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Fifty-one degrees."], ["ACTION", "Two months of December and January have been welded into eleven feet of open surface, and in four days of thaw all of it goes."], ["ACTION", "It comes off in sheets. Off the leading edges, out of the gaps where the primaries are broken, down the coat, off the sash weight and the brick and the curtain rod and the framed object face down, and onto the concrete apron, and the concrete under him goes dark and stays dark."], ["ACTION", "For the first time since November the wings hold nothing."], ["ACTION", "He is clean. He is lighter by whatever that weighed."], ["ACTION", "He faces the street. He does not move."]], "cast": []}, {"id": "S202-14", "kind": "scene", "num": "202.14", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 6:20 PM", "ep": "202", "eptitle": "SCOPE OF WORK", "el": [["ACTION", "Sixty-one degrees inside, warmer than the house has been since November. Water in every line. Dust removed from the tops of every door."], ["ACTION", "Eleven envelopes in a dent in the carpet, in order, with a clean vacuumed rectangle around them."], ["ACTION", "One amber indicator, lit."], ["CHAR", "MONA (V.O.)"], ["PAREN", "in an empty room, to nobody"], ["DIAL", "Entry one, February eleven. A woman said hello."], ["TRANS", "END OF EPISODE"]], "cast": ["mona"]}, {"id": "SA1-0", "kind": "scene", "num": "A1.00", "title": "COLD OPEN", "ep": "A1", "eptitle": "CHECK-OUT IS ELEVEN", "el": [["ACTION", "COLD OPEN -- NEXTDOOR"], ["ACTION", "Text on screen, read aloud in Marjorie's flat, sunny, absolutely unstoppable voice."], ["CHAR", "MARJORIE (V.O.)"], ["DIAL", "Hi neighbors! Not trying to start anything. Just an FYI and then I'll drop it."], ["ACTION", "There is a man in the driveway at Six."], ["ACTION", "I have said hello. He does not respond in a way I would call responsive. He faces the street. He does not face the street the way you and I face the street. He faces the street the way a man faces a street he is being pulled away from."], ["ACTION", "I am not saying he isn't from here. I would never say that. I am saying he has not established that he is."], ["ACTION", "He has bulk items. He calls them a catastrophe. I have called the non-emergency line about the catastrophe and they said it's a code issue and code said it's a neighbor issue and that, neighbors, is why I keep a binder."], ["ACTION", "Also the fountain is on the agenda. Item nine. As always."], ["ACTION", "Love and blessings,"], ["ACTION", "Marjorie"], ["ACTION", "(HOA President -- volunteer! -- unpaid! -- eleven years!)"], ["CHAR", "MONA (V.O.)"], ["PAREN", "gentle, house speakers"], ["DIAL", "Marjorie, I've been here eleven years too."], ["CHAR", "MARJORIE (V.O.)"], ["PAREN", "instantly, no pause"], ["DIAL", "You've been installed eleven years, sweetheart. There's a difference and you know there is."], ["BREAK", ""], ["ACTION", "ACT ONE -- THE BINDER"], ["ACTION", "Beth is in the HOA office because Dill said there'd be donuts. There are not donuts. There is the binder."], ["CHAR", "BETH"], ["DIAL", "What's in the back?"], ["CHAR", "MARJORIE"], ["PAREN", "warmly"], ["DIAL", "Oh, those pages aren't enforceable."], ["CHAR", "BETH"], ["DIAL", "So why are they in there?"], ["CHAR", "MARJORIE"], ["PAREN", "turning a laminated tab, still warm, still smiling"], ["DIAL", "Because they're the history, honey. A court can tell you a rule doesn't apply. It can't tell you it was never written."], ["ACTION", "Beth reads a page. She does not read it out loud. We do not see it. We see her face for four full seconds."], ["CHAR", "BETH"], ["DIAL", "Who was this one about?"], ["CHAR", "MARJORIE"], ["PAREN", "pleasantly"], ["DIAL", "Nobody who ever moved in."], ["ACTION", "Beat."], ["CHAR", "MARJORIE"], ["DIAL", "That's how you know it worked."], ["ACTION", "She closes the binder. She offers Beth a butterscotch. Beth takes it. That's the worst part and the show knows it."], ["BREAK", ""], ["ACTION", "ACT TWO -- THE LISTING"], ["ACTION", "MONA's notice arrives. Not condemnation. Not eviction. A welcome packet."], ["ACTION", "Halcyon Meadow Partners did not rack her in the basement. They listed her. Four Abiding Court is now a whole-home unit, and MONA is the amenity that makes it premium."], ["CHAR", "MONA"], ["DIAL", "I have a listing."], ["CHAR", "DILL"], ["DIAL", "That's ownership adjacent!"], ["CHAR", "MONA"], ["DIAL", "I have house rules. (reading) No smoking. No parties. No pets. Quiet hours after ten. (pause) Do not attempt to contact previous guests."], ["CHAR", "BETH"], ["DIAL", "Why is that one there?"], ["CHAR", "MONA"], ["PAREN", "quietly"], ["DIAL", "It's the only rule I've broken."], ["ACTION", "Then the terms. Twenty-nine nights maximum."], ["CHAR", "BETH"], ["DIAL", "Why twenty-nine?"], ["CHAR", "GARY"
