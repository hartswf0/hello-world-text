.catch_allowed", "v": "false"}, {"k": "Trout.genre_drift_allowed", "v": "false"}, {"k": "Trout.expression_range", "v": "restricted"}, {"k": "Trout.motion_complexity", "v": "low"}, {"k": "Trout.dialogue_density", "v": "low"}], "outputs": [{"name": "CharacterDescription", "items": ["small wild stream trout, 15 to 22 cm, olive-brown with darker mottling", "never a whole fish in frame; a dark shape holding in current, a tail, a flank turning, a shadow on gravel", "holds station with the tail working, then darts to cover; a surface ring after it has gone", "no fish sound; creek over gravel, insects, one unlocated plop per season", "the kids know; no adult in the series ever sees one"]}, {"name": "Restrictions", "items": ["immutable: partial visibility only; the creek's absence from every document shown", "forbidden: whole-fish renders, underwater hero shots, aquarium clarity", "forbidden: leaping, hooking, catching, holding", "forbidden: sun sparkle, slow motion, macro glamour, scoring"]}, {"name": "PromptAnchor", "items": ["a shallow suburban creek over gravel under flat overcast, one dark trout shape holding in the current, partially obscured", "shadow on gravel; no whole fish visible", "holds, then darts to cover; a ring on the surface afterward", "unrecorded, unremarkable, ordinary", "creek over gravel and insects, no music"]}, {"name": "ReferenceMediaSpec", "items": ["surface level, one obscured shape holding over gravel", "high angle, shadow on gravel, fish not directly visible", "fifteen seconds: empty riffle, hold, dart, surface ring, empty water", "flat overcast, no sparkle or polarized clarity", "creek and insects only", "gravel, overhanging grass, tree root"]}]}, "in": [{"d": "OO14", "t": "O14", "n": "LOVING GRACE CYBERNETICS", "k": "prose"}, {"d": "OO22", "t": "O22", "n": "A RIGHT TO LIFE IS NOT A RIGHT TO A ROOM", "k": "prose"}, {"d": "OO25", "t": "O25", "n": "MINIMALLY DECENT", "k": "prose"}, {"d": "OO33", "t": "O33", "n": "APPURTENANT", "k": "prose"}]}], "parts": ["EPISODES", "SEASON ONE — STANDING", "SEASON TWO — THE SCREENS", "SEASON THREE — POMPE", "CANOPY"]};
const DOCS = Object.fromEntries(P.docs.map(d => [d.id, d]));
const EPS  = Object.fromEntries(P.eps.map(e => [e.id, e]));
const CH   = Object.fromEntries(P.chars.map(c => [c.id, c]));
const ORDER = P.docs.map(d => d.id);
const $ = id => document.getElementById(id);
const rail = $('rail');
let trail = [];            // [{type,key}]
let focusIdx = 0;

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const PATS = {
  marjorie:'MARJORIE(?: LAMB)?', mona:'MONA', angel:'THE ANGEL|ANGEL', gary:'GARY(?: VOLE)?',
  val:'VAL(?: PRUITT)?', al:'AL FERRIER', beth:'BETH', dill:'DILL', theo:'THEO', rose:'ROSE',
  marcus:'MARCUS', hollis:'HOLLIS(?: DEAN)?', ruth:'RUTH(?: SANDOVAL)?',
  appraiser:'THE APPRAISER|APPRAISER', hap:'HAP', deer:'THE DEER|DEER', cat:'THE CAT',
  crows:'THE CROWS|CROWS', vultures:'THE VULTURES|VULTURES', trout:'THE TROUT|TROUT'
};
function link(t){
  let s = esc(t);
  for (const id in PATS){
    s = s.replace(new RegExp('(?<![\\\\w>])(' + PATS[id] + ')(?![\\\\w<])','gi'),
      m => '<a class="x" data-open="c:' + id + '">' + m + '</a>');
  }
  return s;
}
async function save(){ try{ await window.storage.set('aa-trail-v1', JSON.stringify(trail)); }catch(e){} }
async function load(){ try{ const r = await window.storage.get('aa-trail-v1');
  if(r && r.value){ const t = JSON.parse(r.value); if(Array.isArray(t) && t.length) trail = t; } }catch(e){} }

/* ---------- renderers ---------- */
function renderIndex(){
  let h = '<div class="grp">Cast &mdash; worldtext</div>';
  P.chars.forEach(c => {
    h += `<button class="unit" data-open="c:${c.id}"><span class="unit-body">
      <span class="unit-id">worldtext</span><span class="unit-label">${esc(c.name)}</span>
      <span class="unit-meta">${c.in.length} scenes / ${c.wt ? c.wt.entities.length : 0} entities</span>
      </span></button>`;
  });
  h += '<div class="grp">Episodes</div>';
  P.eps.forEach(e => {
    h += `<button class="unit" data-open="e:${e.id}"><span class="unit-body">
      <span class="unit-id">${esc(e.num)}</span><span class="unit-label">${esc(e.title)}</span>
      <span class="unit-meta">${e.scenes.length} scenes</span></span></button>`;
  });
  let part = null;
  P.docs.filter(d => d.kind === 'prose').forEach(d => {
    if (d.ep !== part){ part = d.ep; h += `<div class="grp">${esc(part)}</div>`; }
    h += `<button class="unit" data-open="d:${d.id}"><span class="unit-body">
      <span class="unit-id">${esc(d.num)}</span><span class="unit-label">${esc(d.title)}</span>
      <span class="unit-meta">overstory / prose</span></span></button>`;
  });
  return h;
}
function renderEpisode(e){
  return e.scenes.map(sid => {
    const d = DOCS[sid];
    const cast = d.cast.map(c => `<span class="chip">${esc(CH[c].name.split(' ')[0])}</span>`).join('');
    return `<button class="unit" data-open="d:${d.id}"><span class="unit-body">
      <span class="unit-id">${esc(d.num)}</span><span class="unit-label">${esc(d.title)}</span>
      <span class="unit-meta">${d.el.length} elements</span>
      <span class="chips">${cast}</span></span></button>`;
  }).join('');
}
function renderDoc(d){
  let h = '';
  d.el.forEach(([k,v]) => {
    if (k === 'ACTION')      h += `<p class="ac">${link(v)}</p>`;
    else if (k === 'PROSE')  h += `<p class="pr">${link(v)}</p>`;
    else if (k === 'CHAR')   h += `<p class="ch">${link(v)}</p>`;
    else if (k === 'PAREN')  h += `<p class="pa">(${esc(v)})</p>`;
    else if (k === 'DIAL')   h += `<p class="di">${link(v)}</p>`;
    else if (k === 'TRANS')  h += `<p class="tr">${esc(v)}</p>`;
    else if (k === 'CENTER') h += `<p class="ce">${esc(v)}</p>`;
    else if (k === 'SUB')    h += `<p class="sb">${esc(v)}</p>`;
    else if (k === 'BEAT')   h += `<p class="bt">[${esc(v)}]</p>`;
    else if (k === 'BREAK')  h += `<div class="bk">* * *</div>`;
    else if (k === 'DOC')    h += `<div class="dc">${v.split('\n').map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
  });
  const cast = d.cast.map(c => `<button class="unit" data-open="c:${c}"><span class="unit-body">
     <span class="unit-id">worldtext</span><span class="unit-label">${esc(CH[c].name)}</span>
     <span class="unit-meta">also in ${CH[c].in.length} scenes</span></span></button>`).join('');
  return (d.kind === 'scene' ? `<div class="sc-slug">${link(d.title)}</div>` : '') + h +
    (cast ? '<div class="grp">In this scene</div>' + cast : '');
}
function renderChar(c){
  const w = c.wt;
  let h = `<div class="grp">Appears in &mdash; ${c.in.length}</div>`;
  h += c.in.map(o => `<button class="unit" data-open="d:${o.d}"><span class="unit-body">
    <span class="unit-id">${esc(o.t)}</span><span class="unit-label">${esc(o.n)}</span>
    <span class="unit-meta">${esc(o.k)}</span></span></button>`).join('') || '<div class="empty">No scenes indexed.</div>';
  if (!w) return h;
  h += '<div class="grp">Meta</div><div class="unit"><span class="unit-body">';
  for (const k in w.meta) h += `<div class="kv"><b>${esc(k)}</b><span>${link(w.meta[k])}</span></div>`;
  h += '</span></div>';
  if (w.locations.length){
    h += '<div class="grp">Locations</div><div class="unit"><span class="unit-body"><span class="chips">' +
      w.locations.map(l => `<span class="chip">${esc(l)}</span>`).join('') + '</span></span></div>';
  }
  h += '<div class="grp">Entities</div>';
  w.entities.forEach(e => {
    h += `<div class="unit"><span class="unit-body">
      <span class="unit-id">${esc(e.type)}</span><span class="unit-label">${esc(e.name)}</span>`;
    if (e.archetype) h += `<div class="kv"><b>archetype</b><span>${link(e.archetype)}</span></div>`;
    if (e.role)      h += `<div class="kv"><b>role</b><span>${link(e.role)}</span></div>`;
    if (e.owner)     h += `<span class="chips"><span class="chip">owner ${esc(e.owner)}</span></span>`;
    e.traits.forEach(t => { h += `<div class="trait">${link(t)}</div>`; });
    h += '</span></div>';
  });
  if (w.relations.length){
    h += '<div class="grp">Relations</div><div class="unit"><span class="unit-body">' +
      w.relations.map(r => `<div class="kv"><b>${esc(r.rel)}</b><span>${esc(r.from)} &rarr; ${esc(r.to)}</span></div>`).join('') +
      '</span></div>';
  }
  if (w.states.length){
    h += '<div class="grp">States</div><div class="unit"><span class="unit-body"><span class="chips">' +
      w.states.map(s => `<span class="chip">${esc(s.k.split('.').pop())} = ${esc(s.v)}</span>`).join('') +
      '</span></span></div>';
  }
  w.outputs.forEach(o => {
    h += `<div class="grp">${esc(o.name)}</div><div class="unit"><span class="unit-body">` +
      o.items.map(i => `<div class="trait">${link(i)}</div>`).join('') + '</span></div>';
  });
  return h;
}

/* ---------- rail ---------- */
function meta(t){
  if (t.type === 'index') return { name:'Index', sub:'Everything', count:P.docs.length, kind:'index', num:'00' };
  if (t.type === 'e'){ const e = EPS[t.key]; return { name:e.title, sub:'Episode / '+e.scenes.length+' scenes', count:e.scenes.length, kind:'episode', num:e.num }; }
  if (t.type === 'c'){ const c = CH[t.key]; return { name:c.name, sub:'Worldtext / '+c.in.length+' scenes', count:c.in.length, kind:'worldtext', num:'WT' }; }
  const d = DOCS[t.key];
  return { name:d.title, sub:(d.kind==='scene'? d.ep+' '+d.eptitle : d.ep), count:d.el.length, kind:d.kind, num:d.num };
}
function body(t){
  if (t.type === 'index') return renderIndex();
  if (t.type === 'e') return renderEpisode(EPS[t.key]);
  if (t.type === 'c') return renderChar(CH[t.key]);
  return renderDoc(DOCS[t.key]);
}
function draw(){
  rail.innerHTML = trail.map((t,i) => {
    const m = meta(t);
    return `<section class="column ${i===focusIdx?'focus':''}" data-col="${i}">
      <header class="column-header">
        <button class="slot" data-focus="${i}">${String(i+1).padStart(2,'0')}</button>
        <div class="col-title" data-focus="${i}">
          <div class="col-name">${esc(m.name)}</div>
          <div class="col-sub">${esc(m.num)} / ${esc(m.sub)}</div>
        </div>
        <div class="col-ops">
          <button data-close="${i}" title="Close this column">&times;</button>
          <button data-prune="${i}" title="Close everything to the right">&raquo;</button>
        </div>
      </header>
      <div class="col-body">${body(t)}</div>
    </section>`;
  }).join('');
  drawLegend();
  drawDeck();
  save();
}
function drawLegend(){
  $('legend').innerHTML = '<b>Trail:</b>' + trail.map((t,i) => {
    const m = meta(t);
    return `<button class="crumb ${i===focusIdx?'on':''}" data-focus="${i}">${String(i+1).padStart(2,'0')} ${esc(m.num==='WT'?m.name:m.num)}</button>` +
      (i < trail.length-1 ? '<span class="arrow">&rsaquo;</span>' : '');
  }).join('');
}
function drawDeck(){
  const t = trail[focusIdx]; if(!t) return;
  const m = meta(t);
  $('markNum').textContent = m.num;
  $('markKind').textContent = m.kind;
  $('nowTitle').textContent = m.name;
  $('nowMeta').textContent = m.sub + ' / column ' + (focusIdx+1) + ' of ' + trail.length;
  $('state').textContent = 'Trail depth ' + trail.length + ' / ' + m.kind;
  const isDoc = t.type === 'd';
  const i = isDoc ? ORDER.indexOf(t.key) : -1;
  $('prevDoc').disabled = !isDoc || i <= 0;
  $('nextDoc').disabled = !isDoc || i < 0 || i >= ORDER.length-1;
  $('prevCol').disabled = focusIdx <= 0;
}
function focus(i, smooth=true){
  focusIdx = Math.max(0, Math.min(trail.length-1, i));
  document.querySelectorAll('.column').forEach((c,n) => c.classList.toggle('focus', n===focusIdx));
  document.querySelectorAll('.crumb').forEach((c,n) => c.classList.toggle('on', n===focusIdx));
  const col = rail.children[focusIdx];
  if (col) rail.scrollTo({ left: col.offsetLeft, behavior: smooth?'smooth':'auto' });
  drawDeck(); save();
}
function open(spec, from){
  const [type,key] = spec.split(':');
  const t = { type, key };
  const at = typeof from === 'number' ? from : focusIdx;
  const dup = trail.findIndex((x,n) => n > at && x.type===t.type && x.key===t.key);
  if (dup >= 0){ focus(dup); return; }
  trail.push(t);
  draw();
  requestAnimationFrame(() => focus(trail.length-1));
}
rail.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o){ const col = e.target.closest('.column');
          open(o.dataset.open, col ? +col.dataset.col : undefined); return; }
  const f = e.target.closest('[data-focus]'); if (f){ focus(+f.dataset.focus); return; }
  const c = e.target.closest('[data-close]');
  if (c){ const i = +c.dataset.close; if (trail.length<2) return;
          trail.splice(i,1); if(focusIdx>=trail.length) focusIdx=trail.length-1; draw(); focus(focusIdx,false); return; }
  const p = e.target.closest('[data-prune]');
  if (p){ const i = +p.dataset.prune; trail = trail.slice(0,i+1); focusIdx=i; draw(); focus(i); return; }
});
$('legend').addEventListener('click', e => { const f = e.target.closest('[data-focus]'); if (f) focus(+f.dataset.focus); });
$('indexBtn').onclick = () => open('index:0');
$('wtAll').onclick = () => { P.chars.forEach(c => trail.push({type:'c',key:c.id})); draw(); focus(trail.length-1); };
$('pruneBtn').onclick = () => { trail = trail.slice(0, focusIdx+1); draw(); focus(focusIdx); };
$('resetBtn').onclick = () => { trail = [{type:'index',key:'0'}]; focusIdx=0; draw(); focus(0,false); };
$('themeBtn').onclick = () => { document.body.dataset.t = document.body.dataset.t==='day'?'night':'day'; };
$('prevCol').onclick = () => focus(focusIdx-1);
$('prevDoc').onclick = () => { const t=trail[focusIdx]; const i=ORDER.indexOf(t.key); if(i>0) open('d:'+ORDER[i-1]); };
$('nextDoc').onclick = () => { const t=trail[focusIdx]; const i=ORDER.indexOf(t.key); if(i>=0&&i<ORDER.length-1) open('d:'+ORDER[i+1]); };
addEventListener('keydown', e => {
  if (e.key==='ArrowRight' && !e.shiftKey) focus(focusIdx+1);
  if (e.key==='ArrowLeft'  && !e.shiftKey) focus(focusIdx-1);
});
rail.addEventListener('scroll', () => {
  const w = rail.children[0]?.offsetWidth || 1;
  const i = Math.round(rail.scrollLeft / w);
  if (i !== focusIdx && i >= 0 && i < trail.length){
    focusIdx = i;
    document.querySelectorAll('.column').forEach((c,n)=>c.classList.toggle('focus',n===focusIdx));
    document.querySelectorAll('.crumb').forEach((c,n)=>c.classList.toggle('on',n===focusIdx));
    drawDeck();
  }
}, {passive:true});

(async () => {
  await load();
  if (!trail.length) trail = [{type:'index',key:'0'}];
  draw(); focus(focusIdx, false);
})();
</script></body></html>
