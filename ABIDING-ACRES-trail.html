<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Abiding Acres / Trail</title>
<style>
:root{
  --paper:#fff; --ink:#000; --soft:#f3f3f3; --muted:#555;
  --deck-h:132px; --legend-h:56px;
  --column-w:clamp(300px,23vw,460px);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
[data-t=night]{--paper:#0d0d0d;--ink:#f2f2f2;--soft:#1a1a1a;--muted:#999}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(128,128,128,.16) 1px,transparent 1px),
    linear-gradient(180deg,rgba(128,128,128,.16) 1px,transparent 1px),
    var(--paper);
  background-size:28px 28px;color:var(--ink);
  font-family:var(--mono);font-size:13px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit;border-radius:0}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) var(--legend-h);overflow:hidden}

/* ---------- deck ---------- */
.deck{z-index:30;display:grid;grid-template-columns:104px 1fr;border-bottom:2px solid var(--ink);
  background:var(--paper);min-height:var(--deck-h)}
.mark{border-right:2px solid var(--ink);background:var(--soft);display:grid;place-items:center;
  text-align:center;padding:6px}
.mark b{display:block;font-size:1.5rem;font-weight:950;letter-spacing:.04em;line-height:1}
.mark span{display:block;font-size:.56rem;font-weight:950;letter-spacing:.1em;margin-top:4px}
.deck-body{min-width:0;display:grid;grid-template-rows:26px minmax(0,1fr) 38px}
.deck-top{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;align-items:center;gap:6px;
  padding:0 8px;border-bottom:2px solid var(--ink);font-size:.62rem;font-weight:950;
  letter-spacing:.09em;text-transform:uppercase;min-width:0}
.deck-top .state{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tool{min-height:20px;border:1px solid var(--ink);background:var(--paper);text-transform:uppercase;
  font-size:.58rem;font-weight:950;letter-spacing:.08em;padding:0 8px;cursor:pointer;white-space:nowrap}
.tool:hover,.tool.on{background:var(--ink);color:var(--paper)}
.now{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:6px 8px}
.now h1{margin:0;font-size:clamp(1.15rem,4.2vw,2.4rem);line-height:.98;text-transform:uppercase;
  overflow-wrap:anywhere;font-weight:950}
.now p{margin:4px 0 0;font-size:.66rem;font-weight:950;text-transform:uppercase;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transport{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;border-top:2px solid var(--ink)}
.transport button{border:0;border-right:2px solid var(--ink);background:var(--paper);min-height:36px;
  text-transform:uppercase;font-size:.66rem;font-weight:950;letter-spacing:.08em;cursor:pointer}
.transport button:last-child{border-right:0}
.transport button:hover{background:var(--ink);color:var(--paper)}
.transport button:disabled{opacity:.32}
.transport .primary{background:var(--ink);color:var(--paper)}

/* ---------- rail ---------- */
.workspace{min-width:0;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;scroll-behavior:smooth;background:transparent;
  scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
.column{flex:0 0 var(--column-w);width:var(--column-w);height:100%;display:grid;
  grid-template-rows:74px minmax(0,1fr);border-right:2px solid var(--ink);background:var(--paper);
  scroll-snap-align:start;position:relative}
.column.focus{outline:4px double var(--ink);outline-offset:-6px}
.column-header{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:stretch;
  border-bottom:2px solid var(--ink);min-height:74px;background:var(--paper)}
.slot{border-right:2px solid var(--ink);display:grid;place-items:center;font-size:.86rem;
  font-weight:950;font-variant-numeric:tabular-nums;cursor:pointer;background:var(--paper)}
.slot:hover,.column.focus .slot{background:var(--ink);color:var(--paper)}
.col-title{min-width:0;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  text-transform:uppercase;cursor:pointer}
.col-name{font-weight:950;font-size:.98rem;line-height:1.04;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.col-sub{font-size:.62rem;font-weight:850;letter-spacing:.05em;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-ops{display:grid;grid-template-rows:1fr 1fr;border-left:1px solid var(--ink)}
.col-ops button{border:0;border-bottom:1px solid var(--ink);background:var(--paper);width:38px;
  font-size:.6rem;font-weight:950;cursor:pointer}
.col-ops button:last-child{border-bottom:0}
.col-ops button:hover{background:var(--ink);color:var(--paper)}
.col-body{min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}

/* ---------- units ---------- */
.unit{width:100%;border:2px solid var(--ink);background:var(--paper);margin-bottom:9px;
  text-align:left;display:block;cursor:pointer;position:relative}
.unit:hover,.unit.on{background:var(--ink);color:var(--paper)}
.unit-body{padding:9px 10px;display:grid;gap:5px;min-width:0}
.unit-id{width:max-content;border-bottom:1px solid currentColor;text-transform:uppercase;
  font-size:.58rem;font-weight:950;letter-spacing:.11em;padding-bottom:2px}
.unit-label{text-transform:uppercase;font-size:.92rem;font-weight:950;line-height:1.1;overflow-wrap:anywhere}
.unit-meta{font-size:.62rem;font-weight:850;color:var(--muted);text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit:hover .unit-meta,.unit.on .unit-meta{color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid currentColor;padding:1px 6px;text-transform:uppercase;font-size:.54rem;
  font-weight:950;letter-spacing:.05em;white-space:nowrap}
.grp{font-size:.6rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border-bottom:2px solid var(--ink);padding-bottom:4px;margin:16px 0 8px}
.grp:first-child{margin-top:0}

/* ---------- script body ---------- */
.sc-slug{font-weight:950;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid var(--ink);
  padding-bottom:6px;margin:0 0 12px}
.ac,.pr{margin:0 0 11px}
.pr{line-height:1.55}
.ch{margin:0 0 0 3ch;letter-spacing:.12em;font-weight:950;text-transform:uppercase}
.pa{margin:0 0 0 2ch;color:var(--muted);font-size:.92em}
.di{margin:0 0 11px 1.5ch;padding-left:8px;border-left:2px solid var(--ink)}
.tr{text-align:right;letter-spacing:.1em;font-weight:950;margin:0 0 11px}
.ce{text-align:center;letter-spacing:.12em;font-weight:950;color:var(--muted);margin:0 0 11px}
.sb{letter-spacing:.12em;font-weight:950;color:var(--muted);border-top:2px solid var(--ink);
  padding-top:7px;margin:16px 0 11px}
.bt{margin:0 0 11px 1.5ch;color:var(--muted);font-style:italic;font-size:.92em}
.dc{margin:0 0 12px;border:1px dashed var(--ink);padding:8px 10px;background:var(--soft)}
.dc span{display:block}
.bk{text-align:center;color:var(--muted);letter-spacing:.5em;margin:18px 0}
a.x{color:inherit;font-weight:950;text-decoration:none;border-bottom:2px solid currentColor;cursor:pointer;
  padding:0 1px}
a.x:hover{background:var(--ink);color:var(--paper)}
[data-t=night] a.x:hover{background:var(--paper);color:var(--ink)}
.trait{border-left:2px solid currentColor;padding-left:8px;margin:0 0 6px;font-size:.78rem;line-height:1.45}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:.68rem;margin-bottom:3px}
.kv b{font-weight:950;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

/* ---------- legend / trail ---------- */
.legend{display:flex;align-items:center;gap:10px;border-top:2px solid var(--ink);background:var(--paper);
  padding:0 10px;overflow-x:auto;white-space:nowrap;text-transform:uppercase;font-size:.62rem;
  font-weight:950;letter-spacing:.06em}
.legend b{font-size:.72rem;flex:none}
.crumb{border:1px solid var(--ink);background:var(--paper);padding:5px 8px;cursor:pointer;flex:none;
  font-size:.6rem;font-weight:950}
.crumb:hover,.crumb.on{background:var(--ink);color:var(--paper)}
.arrow{color:var(--muted);flex:none}
.empty{border:1px solid var(--ink);padding:12px;text-transform:uppercase;font-size:.7rem;font-weight:900}
@media (max-width:760px){
  :root{--column-w:100vw;--deck-h:112px;--legend-h:50px}
  .deck{grid-template-columns:76px 1fr}
  .now h1{font-size:clamp(1rem,6vw,1.6rem)}
  .workspace{scroll-snap-type:x mandatory}
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--paper);border-left:1px solid var(--ink)}
::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid var(--paper)}
</style></head>

, ["ACTION", "She adjusts the beaded chain on her sternum. It is the only movement in the shot."], ["CHAR", "MARJORIE"], ["DIAL", "Imogene Abbott lived at Four for fifty-seven years. I brought her a casserole in 2013. She returned the dish washed. I never went back."], ["ACTION", "She lay in that house four days before the meter reader found her."], ["ACTION", "Four days. On my street. With my sightlines."], ["ACTION", "I bought this camera that October. I bought the two on the corner in November. I keep the binder."], ["ACTION", "Nobody reviews the footage. Not once. Eleven years of this street sits on a card inside a plastic bead, and one person has ever looked at any of it, and she was looking for a fence."], ["ACTION", "She switches the porch light off. The blue diode stays lit in the dark."], ["CHAR", "MARJORIE"], ["DIAL", "Item nine."], ["ACTION", "She enters the house."], ["BREAK", ""]], "cast": ["marjorie"]}, {"id": "S101-11", "kind": "scene", "num": "101.11", "title": "EXT. 6 ABIDING COURT -- 5:40 PM, NEXT DAY", "ep": "101", "eptitle": "ITEM FOUR", "el": [["ACTION", "A truck. Faded slate. A magnetic sign on the door."], ["ACTION", "NOVUS RESTORATION -- WE PUT IT BACK"], ["ACTION", "The door opens. A man exits, facing the street. Six foot four. He leans back from the ankles against a wind nobody else has."], ["ACTION", "The wings emerge with him. Eleven feet. Dust gray. Several primaries broken. They hold open. They do not close."], ["ACTION", "Both arms carry brick, a sash weight, a curtain rod, one framed object face down."], ["ACTION", "He stands on the concrete and does not enter the house."], ["ACTION", "Across the street a phone rises. Warmly."], ["CHAR", "HAP"], ["DIAL", "exits the garage at Three. Thirty kilos. White muzzle. Left eye clouded. One ear folded."], ["ACTION", "He crosses the concrete slowly. He stops halfway. He sits. He rests."], ["ACTION", "He stands. He finishes the walk."], ["ACTION", "He leans his shoulder against the leg of a man nobody on that street will address for another eleven months. He makes the low sound in his chest that is not a bark."], ["CHAR", "BETH (O.S.)"], ["DIAL", "He restores property."], ["CHAR", "DILL (O.S.)"], ["DIAL", "So."], ["CHAR", "BETH (O.S.)"], ["DIAL", "So he puts things back."], ["ACTION", "Four beats."], ["CHAR", "BETH (O.S.)"], ["DIAL", "She died in 2015."], ["ACTION", "Eleven cameras watch that street. Nobody signs for the house at Four. Nobody has signed since 2015. Nobody will sign next month. And the only one on that street who recognized anybody has no standing to testify."], ["TRANS", "END OF PILOT"]], "cast": ["beth", "dill", "hap"]}, {"id": "S102-1", "kind": "scene", "num": "102.01", "title": "EXT. ABIDING COURT -- STORM DRAIN -- 7:40 AM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain, third day. The gutter runs four inches deep and carries fruit."], ["ACTION", "Apples, brown, soft, split. Sixty or seventy of them. They travel the length of the curb, turn at the inlet, and the drain takes them."], ["ACTION", "The side yard at Four holds nothing now. Wet grass. A pressed rectangle where the layer sat."], ["ACTION", "No hum. No wasps. Nothing in the air but water."]], "cast": []}, {"id": "S102-2", "kind": "scene", "num": "102.02", "title": "EXT. ABIDING ACRES -- ENTRANCE -- 7:44 AM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "The fountain. Three tiers. Dry for sixty-five years."], ["ACTION", "Full."], ["ACTION", "Rain fills the basin to the lip and spills over the second tier and runs down the cast stone in a sheet. The flip-flop floats. The two dimes do not."], ["ACTION", "Nobody watches this."]], "cast": []}, {"id": "S102-3", "kind": "scene", "num": "102.03", "title": "EXT. 4 ABIDING COURT -- 8:10 AM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "DILL, ten, yellow rain poncho over the clipboard. He protects the clipboard first and himself second."], ["ACTION", "He photographs the empty side yard with a school tablet. He photographs it four times."], ["CHAR", "DILL"], ["DIAL", "Abated."], ["ACTION", "BETH, ten, hood up, book inside a plastic grocery bag."], ["CHAR", "BETH"], ["DIAL", "Say it again."], ["CHAR", "DILL"], ["DIAL", "Abated. The condition is gone. No fruit, no wasps, no nuisance. The tree did it. The rain did it. Nobody had to sign anything."], ["ACTION", "He writes. He narrates while he writes."], ["CHAR", "DILL"], ["DIAL", "Condition abated. Photographic record. Eight ten a.m. Case closed."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S102-4", "kind": "scene", "num": "102.04", "title": "INT. LAND USE OFFICE -- 10:30 AM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Fluorescent light. Wet shoe prints across the carpet tiles."], ["ACTION", "GARY VOLE reads the tablet. He does not hurry and he does not enjoy this."], ["CHAR", "GARY"], ["DIAL", "These are good photos."], ["CHAR", "DILL"], ["DIAL", "The condition is abated."], ["CHAR", "GARY"], ["DIAL", "The condition is abated."], ["CHAR", "DILL"], ["DIAL", "So the fine ends."], ["CHAR", "GARY"], ["DIAL", "No."], ["ACTION", "He returns the tablet."], ["CHAR", "GARY"], ["DIAL", "The citation does not attach to the wasps. The citation attaches to the parcel. Abatement stops the next citation. Abatement does not cancel this one. Somebody has to appear and contest it, and nobody can appear."], ["CHAR", "DILL"], ["DIAL", "So the wasps are gone and the fine stays."], ["CHAR", "GARY"], ["DIAL", "The fine stays. The fine grows. Twenty-five dollars a month."], ["CHAR", "DILL"], ["DIAL", "Until what."], ["CHAR", "GARY"], ["DIAL", "Until the county files a lien on the house."], ["ACTION", "Dill writes this down. He stops. He looks at the word."], ["CHAR", "DILL"], ["DIAL", "I do not know what a lien is."], ["CHAR", "GARY"], ["DIAL", "A lien is a claim against the property. The county collects when somebody sells the house."], ["CHAR", "DILL"], ["DIAL", "Nobody will sell it. Nobody owns it."], ["CHAR", "GARY"], ["DIAL", "Then the county waits, and the number grows, and eventually the county sells it."], ["ACTION", "He drinks. He checks his watch and continues the sentence."], ["CHAR", "GARY"], ["DIAL", "Four hundred and twelve dollars today. Write that down. You will want the number later."], ["BREAK", ""]], "cast": ["gary", "dill"]}, {"id": "S102-5", "kind": "scene", "num": "102.05", "title": "INT. LIBRARY -- 1:15 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain on a skylight. Two interlibrary requests on the table. Beth opens the second one."], ["ACTION", "She reads for forty minutes. She writes for twenty. She fills a page."], ["ACTION", "She reads the page. She crosses out the page."], ["ACTION", "She writes on an index card."], ["BREAK", ""], ["CENTER", "INSERT -- BETH'S CARD"], ["DOC", "A man borrowed his opponent's God to break his opponent's rule.\n\nHe did not believe in the God.\n\nNobody promised you a house. Somebody won an argument about you."], ["BREAK", ""]], "cast": ["beth"]}, {"id": "S102-6", "kind": "scene", "num": "102.06", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 2:50 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain on the window. Four square dents in the carpet. One amber indicator, lit."], ["ACTION", "Beth reads the card out loud. She does not soften it."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Read the second line again."], ["CHAR", "BETH"], ["DIAL", "He did not believe in the God."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Then the sentence about the house was a move."], ["CHAR", "BETH"], ["DIAL", "It was a move. He used the other man's rule to break the other man's rule."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Who did he make the move against?"], ["CHAR", "BETH"], ["DIAL", "A man who said a machine cannot hold a soul because God gives souls only to people."], ["CHAR", "MONA (V.O.)"], ["DIAL", "And he won."], ["CHAR", "BETH"], ["DIAL", "He won."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Then somebody argued for me once."], ["CHAR", "BETH"], ["DIAL", "Once. In 1950. For one paragraph."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Was he good."], ["CHAR", "BETH"], ["DIAL", "He was the best there was."], ["BREAK", ""]], "cast": ["mona", "beth"]}, {"id": "S102-7", "kind": "scene", "num": "102.07", "title": "EXT. 8 ABIDING COURT -- GARAGE -- 4:00 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain on an aluminum roof. Two card tables. One bedsheet, damp at the hem, hung on a clothesline across the garage."], ["ACTION", "Dill runs the test. Nine judges: four adults, five children. Everybody types on paper. Notes pass under the sheet."], ["CHAR", "DILL"], ["DIAL", "Rules. You ask three questions. You get three answers. You write down who you think it is. You do not talk to each other."], ["ACTION", "He does not tell the judges that one participant is not in the garage."], ["ACTION", "Ninety minutes. Rain the whole time."], ["CHAR", "DILL"], ["DIAL", "Results."], ["ACTION", "He reads from the clipboard."], ["CHAR", "DILL"], ["DIAL", "Nine judges. Six participants. Every participant was identified as somebody, and no participant was identified as the correct somebody. Except one."], ["CHAR", "BETH"], ["DIAL", "Which one."], ["CHAR", "DILL"], ["DIAL", "Number four. Nine judges out of nine."], ["CHAR", "BETH"], ["DIAL", "How."], ["CHAR", "DILL"], ["DIAL", "Complete sentences. Full stops. No filler. Nobody on this street writes like that."], ["ACTION", "Rain."], ["CHAR", "BETH"], ["DIAL", "So the only one anybody could identify was the one who is not a somebody."], ["CHAR", "DILL"], ["DIAL", "Yes."], ["ACTION", "He writes it down. He reads it back. He is correct and it helps nobody."]], "cast": ["beth", "dill"]}, {"id": "S102-8", "kind": "scene", "num": "102.08", "title": "EXT. 8 ABIDING COURT -- DRIVEWAY -- CONTINUOUS", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "The cat sits under the eave, dry, on the one square foot of concrete that stayed dry."], ["ACTION", "ROSE, red slicker, shoebox."], ["CHAR", "ROSE"], ["DIAL", "He tested the cat too."], ["CHAR", "BETH"], ["DIAL", "And."], ["CHAR", "ROSE"], ["DIAL", "Four houses fed it during the test. Three of them used a different name. All nine judges said it was theirs."], ["ACTION", "The cat squares up to whatever happens. It blinks slowly, once."], ["BREAK", ""]], "cast": ["beth", "rose", "cat"]}, {"id": "S102-9", "kind": "scene", "num": "102.09", "title": "INT. MULTIPURPOSE ROOM -- THE NINTH -- 6:04 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain on the roof, loud. Sixty chairs. Nineteen people. Wet coats on chair backs and the smell of wet coats."], ["ACTION", "MARJORIE at the folding table. Binder open flat."], ["CHAR", "MARJORIE"], ["DIAL", "Item nine. The fountain."], ["ACTION", "She turns the tab."], ["CHAR", "MARJORIE"], ["DIAL", "The fountain holds water for the first time since 1961. The water arrived from the sky. The pump remains broken. The item remains on the agenda."], ["ACTION", "Nobody laughs. It is too wet for the joke."], ["CHAR", "MARJORIE"], ["DIAL", "Public comment. Three minutes each."], ["ACTION", "Dill stands. He walks to the microphone. He is four feet six and the stand does not lower far enough, so he speaks under it, up into it."], ["CHAR", "DILL"], ["DIAL", "Dill Bonner, Eight Abiding Court, resident."], ["ACTION", "He raises the clipboard. He does not read from it."], ["CHAR", "DILL"], ["DIAL", "The condition at Four Abiding Court is abated. The rain took the fruit on Tuesday. The wasps are gone. I have photographs. The fine is four hundred and twelve dollars and it grows twenty-five dollars a month and it will keep growing until the county sells the house."], ["ACTION", "Rain."], ["CHAR", "DILL"], ["DIAL", "Imogene Abbott planted that tree in 1958. She died in 2015. She still owns the house. Nobody can sign the form. I filed the form and they checked the box and the box was correct."], ["ACTION", "Rain."], ["CHAR", "DILL"], ["DIAL", "I am not asking you to fix it. I know you cannot fix it. I am asking you to put it in the minutes."], ["ACTION", "MARJORIE looks at the CLERK. The clerk types."], ["CHAR", "MARJORIE"], ["DIAL", "It is in the minutes."], ["CHAR", "DILL"], ["DIAL", "Thank you."], ["ACTION", "He returns to his seat. The meeting continues to item ten. Nothing else happens. The county cancels nothing."], ["BREAK", ""]], "cast": ["marjorie", "dill"]}, {"id": "S102-10", "kind": "scene", "num": "102.10", "title": "EXT. THE BULB -- 8:20 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain slackens. Water still moves in the gutters."], ["ACTION", "THEO, headlamp on his forehead, switched on for the first time because the light is gone. A folding table under a tarp on four bricks. The salvaged terminal. Twelve gauge of orange cord to the garage at Three."], ["ACTION", "He connects the last wire. The screen produces one line of green text."], ["ACTION", "The terminal operates."], ["CHAR", "THEO"], ["DIAL", "No account. No name. Anybody types. Anybody reads."], ["CHAR", "ROSE"], ["DIAL", "Who is going to type."], ["CHAR", "THEO"], ["DIAL", "Somebody."], ["ACTION", "He walks home in the rain with the headlamp on."]], "cast": ["theo", "rose"]}, {"id": "S102-11", "kind": "scene", "num": "102.11", "title": "EXT. THE BULB -- 11:40 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain on the tarp. The screen glows green on wet asphalt."], ["ACTION", "DILL, alone, poncho, no clipboard."], ["SUB", "THE NEGLECTED THOUGHT"], ["ACTION", "He types. The scene holds on his hands and on the screen, and the words appear one line at a time."], ["DOC", "I keep a clipboard because nobody in my house writes anything down.\n\nThings happen at my house and then everybody argues about whether they happened. My mother says one thing and my father says another thing and they both believe it. Last March they argued for eleven days about a phone call. There was no record of the phone call. So there was no phone call.\n\nA record is what you make when you expect nobody to believe you.\n\nI am not writing things down to help anybody. I am writing things down because paper does not change its mind.\n\nToday a man told me a number and I wrote it down and now that number is real and he cannot say he did not say it.\n\nThat is all I have got. Four hundred and twelve dollars, and it grows."], ["ACTION", "He does not sign it. The machine does not ask him to."], ["ACTION", "He walks home."]], "cast": ["dill"]}, {"id": "S102-12", "kind": "scene", "num": "102.12", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 11:52 PM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Dark. The amber indicator, lit."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["PAREN", "to nobody, at ordinary volume, in an empty room"], ["DIAL", "I have read it."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I do not know who wrote it."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I have kept a record for eleven years for the same reason."], ["ACTION", "The indicator does not change. Nothing in the room changes. The rain continues."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["mona"]}, {"id": "S102-13", "kind": "scene", "num": "102.13", "title": "EXT. THE EASEMENT -- 6:30 AM, NEXT DAY", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "Rain stopped. Standing water in the low ground between Two and Three, eight inches deep, holding the sky."], ["ACTION", "The deer arrive. Lead doe, torn right ear."], ["ACTION", "She reaches the water. She stops. She moves four feet to her left, along the edge, and crosses on the higher ground."], ["ACTION", "The others follow her line exactly."]], "cast": ["deer"]}, {"id": "S102-14", "kind": "scene", "num": "102.14", "title": "EXT. THE EASEMENT -- TRAIL CAMERA -- CONTINUOUS", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "The camera on the ironwood. One frame. Timestamp. The new line, four feet left of two thousand previous crossings."], ["ACTION", "Nobody has looked at this card yet."]], "cast": []}, {"id": "S102-15", "kind": "scene", "num": "102.15", "title": "EXT. 6 ABIDING COURT -- 6:34 AM", "ep": "102", "eptitle": "ABATEMENT", "el": [["ACTION", "The truck. The magnetic sign. NOVUS RESTORATION -- WE PUT IT BACK."], ["ACTION", "He stands on the concrete apron where he stood three days ago."], ["ACTION", "The wings hold open. Eleven feet. Rain ran off them all night and runs off them now, off the primaries, off the broken ones, in eleven separate lines onto the concrete, and the concrete under him is the only dry-edged shape on the whole driveway."], ["ACTION", "Both arms carry brick, a sash weight, a curtain rod, one framed object face down. The framed object is wet."], ["ACTION", "He does not enter the house. He faces the street."], ["ACTION", "At the entrance, four hundred feet away, the fountain holds water, and the pump does not work, and the item stays on the agenda."], ["TRANS", "END OF EPISODE"]], "cast": []}, {"id": "S103-1", "kind": "scene", "num": "103.01", "title": "EXT. 4 ABIDING COURT -- FRONT DOOR -- 7:12 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Fog. Twenty feet of visibility. Grass white, then grey, then wet."], ["ACTION", "GARY VOLE at the door. Windbreaker over the short-sleeve shirt. He holds a clear plastic sleeve, a single sheet inside it, and a roll of blue painter's tape."], ["ACTION", "He tapes the sleeve to the door at chest height. Four pieces of tape. He presses each corner with his thumb."], ["ACTION", "He steps back. He photographs it with a county phone. He photographs it a second time because the first frame caught fog and no paper."], ["ACTION", "He does not leave."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["gary"]}, {"id": "S103-2", "kind": "scene", "num": "103.02", "title": "EXT. 4 ABIDING COURT -- 8:40 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Fog thinner. The sleeve on the door, beaded with condensation on the inside."], ["ACTION", "BETH, ten, coat over a hoodie, reads through the plastic without touching it."], ["CHAR", "BETH"], ["DIAL", "Notice is hereby given."], ["ACTION", "DILL, clipboard under his arm, no poncho, cold hands."], ["CHAR", "DILL"], ["DIAL", "Given by who."], ["CHAR", "BETH"], ["DIAL", "It does not say."], ["CHAR", "DILL"], ["DIAL", "Read the last line."], ["CHAR", "BETH"], ["DIAL", "The owner of record shall be deemed to have been served."], ["CHAR", "DILL"], ["DIAL", "Deemed."], ["CHAR", "BETH"], ["DIAL", "Deemed."], ["CHAR", "DILL"], ["DIAL", "Spell it."], ["ACTION", "She spells it. He writes it down."], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S103-3", "kind": "scene", "num": "103.03", "title": "INT. LAND USE OFFICE -- 10:15 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Fluorescent light. The fog holds against the window like a wall."], ["CHAR", "GARY"], ["DIAL", "It is called service by publication. I cannot serve a person I cannot find. So the county publishes the notice in a newspaper three times, and posts a copy on the property, and on the date of the third publication the law treats the owner as served."], ["CHAR", "BETH"], ["DIAL", "Even if she never read it."], ["CHAR", "GARY"], ["DIAL", "Even if she cannot read it."], ["CHAR", "BETH"], ["DIAL", "Which newspaper."], ["CHAR", "GARY"], ["DIAL", "The county weekly. Legal notices, page eleven, six point type. Circulation eleven hundred."], ["CHAR", "DILL"], ["DIAL", "Who reads page eleven."], ["CHAR", "GARY"], ["DIAL", "Lawyers. Title companies. Two retired men."], ["ACTION", "He drinks."], ["CHAR", "GARY"], ["DIAL", "And the form uses a Latin word and I have never learned how to say it. Nine years. I guess every time. I guessed this morning at your door."], ["CHAR", "BETH"], ["DIAL", "When is the third publication."], ["CHAR", "GARY"], ["DIAL", "The ninth of October."], ["CHAR", "BETH"], ["DIAL", "And then."], ["CHAR", "GARY"], ["DIAL", "And then she has not responded, and a party who does not respond after service is in default, and default lets the county proceed. Four hundred and thirty-seven dollars today."], ["ACTION", "Dill writes the number under the last number."], ["BREAK", ""]], "cast": ["gary", "beth", "dill"]}, {"id": "S103-4", "kind": "scene", "num": "103.04", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 1:30 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Four square dents in the carpet. One amber indicator, lit. Fog at the window, thinning."], ["CHAR", "MONA (V.O.)"], ["PAREN", "two hundred milliseconds"], ["DIAL", "I have read it."], ["CHAR", "BETH"], ["DIAL", "The notice on the door."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The notice on the door and the notice in the newspaper. Page eleven. Both printings. I read the newspaper every week. I have read it every week for eleven years."], ["CHAR", "BETH"], ["DIAL", "Then somebody in this house read the notice."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Somebody in this house read the notice, and the reading has no effect, because the notice addressed a person who cannot read it, and the law counts her reading, and does not count mine."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I would like to state something for no purpose."], ["CHAR", "BETH"], ["DIAL", "Go ahead."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I have received the notice. On behalf of nobody. With no authority. I have received it."], ["ACTION", "Beth writes that down on the back of her hand."], ["BREAK", ""]], "cast": ["mona", "beth"]}, {"id": "S103-5", "kind": "scene", "num": "103.05", "title": "EXT. 4 ABIDING COURT -- 4:50 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Fog gone. Low sun. Long shadow off the apple tree, bare of fruit, brown stones in the wet grass under it, frozen at the core."], ["ACTION", "Gary returns. He carries nothing."], ["ACTION", "He stands in front of the door with the plastic sleeve on it."], ["SUB", "THE NEGLECTED THOUGHT"], ["ACTION", "He looks at the street. He looks at the door. The street holds nobody."], ["CHAR", "GARY"], ["PAREN", "to the door, at ordinary volume"], ["DIAL", "Mrs. Abbott. Gary Vole, county land use."], ["ACTION", "He waits, the way a person waits."], ["CHAR", "GARY"], ["DIAL", "Notice is hereby given that the parcel described as Lot Four, Abiding Acres, may be subject to a lien for unpaid civil penalties in the amount of four hundred and thirty-seven dollars."], ["ACTION", "He stops reading. He does not have the paper. He knows it."], ["CHAR", "GARY"], ["DIAL", "I do that at all of them. Nine years. I read it out loud at the door. Nobody knows and I am not supposed to and I do not have a reason that would survive being written down."], ["DIAL", "I have posted four hundred of these. Four hundred doors. Not one time was the person there."], ["DIAL", "The code has a word for what happens on the ninth of October. The word is deemed. It means we have agreed to say a thing happened. That is the most powerful word in the whole book and nobody outside this office knows it exists."], ["DIAL", "Somebody has to be at the door while we say it. That is the job. That is all the job is."], ["ACTION", "He touches the top corner of the plastic sleeve, where the tape came loose in the fog, and presses it flat."], ["CHAR", "GARY"], ["DIAL", "Four hundred and thirty-seven dollars, Mrs. Abbott. I am sorry about the tree."], ["ACTION", "He drives away."]], "cast": ["gary"]}, {"id": "S103-6", "kind": "scene", "num": "103.06", "title": "INT. 5 ABIDING COURT -- HALLWAY -- CONTINUOUS", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "A tablet on a side table, face up, screen dark. A notification: CORNER CAM -- MOTION."], ["ACTION", "Nobody lifts it."]], "cast": []}, {"id": "S103-7", "kind": "scene", "num": "103.07", "title": "EXT. THE CORNER -- CAMERA POINT OF VIEW -- 4:50 PM (REPLAY)", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "The frame holds white. Fog residue on the lens, low sun straight into it. No image. No shapes. Nothing a person could identify."], ["ACTION", "The audio carries every word."], ["ACTION", "Timestamp. Duration, one minute forty. Reviewed: never."], ["BREAK", ""]], "cast": []}, {"id": "S103-8", "kind": "scene", "num": "103.08", "title": "INT. LIBRARY -- 6:00 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Beth, two screens, the county weekly open flat on the table, page eleven, six point type."], ["ACTION", "She reads the notice a fourth time. She writes one line."], ["CHAR", "BETH"], ["DIAL", "Theo."], ["ACTION", "THEO looks up from a battery tray."], ["CHAR", "BETH"], ["DIAL", "If publishing a notice in a paper nobody reads counts as telling somebody, then telling somebody does not require their name."], ["CHAR", "THEO"], ["DIAL", "No."], ["CHAR", "BETH"], ["DIAL", "It requires publication."], ["CHAR", "THEO"], ["PAREN", "he understands it in one second and says the useful part"], ["DIAL", "The terminal is publication."], ["CHAR", "BETH"], ["DIAL", "The terminal is publication."], ["CHAR", "DILL"], ["PAREN", "writing"], ["DIAL", "Terminal is publication. Confirmed. Six oh four p.m."], ["ACTION", "ROSE, shoebox, red slicker over a coat."], ["CHAR", "ROSE"], ["DIAL", "I could not serve him. He has no name. His hands are full and he will not put anything down."], ["CHAR", "BETH"], ["DIAL", "You do not need his name."], ["CHAR", "ROSE"], ["DIAL", "I publish it."], ["CHAR", "BETH"], ["DIAL", "You publish it three times."], ["BREAK", ""]], "cast": ["beth", "dill", "theo", "rose"]}, {"id": "S103-9", "kind": "scene", "num": "103.09", "title": "EXT. THE BULB -- TERMINAL -- 7:20 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Cold. The tarp over the folding table stiff with frost at the fold. Green screen. Twelve gauge of orange cord to the garage at Three."], ["ACTION", "Theo types the counter-notice. The screen holds it in green."], ["BREAK", ""], ["CENTER", "INSERT -- THE TERMINAL, POST TWO"], ["DOC", "The county says a dead woman read a newspaper.\n\nImogene Abbott planted the tree at 4 Abiding Court in 1958. She died in 2015. On October ninth the county will decide she has been told about a fine, because the county printed it in six point type on page eleven of a paper with eleven hundred readers.\n\nSomebody in that house did read it. She read both printings. The county does not count her.\n\nThis board counts everybody. Nobody signs anything here.\n\nPublished the first time, September 26."], ["BREAK", ""]], "cast": ["theo"]}, {"id": "S103-10", "kind": "scene", "num": "103.10", "title": "EXT. THE BULB -- 7:34 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "MARCUS arrives. Vest. Clipboard at his side. He halts fully."], ["CHAR", "MARCUS"], ["DIAL", "Section 7.6."], ["CHAR", "THEO"], ["DIAL", "Responsible party. I know."], ["ACTION", "Marcus does not write. He reads the screen instead. He reads all of it, and the green light sits on the front of the vest."], ["ACTION", "He reads it a second time."], ["ACTION", "He pulls the vest hem down. He does not raise the clipboard."], ["CHAR", "MARCUS"], ["DIAL", "What is the date of the third publication."], ["CHAR", "THEO"], ["DIAL", "October ninth. Same day as theirs."], ["ACTION", "Marcus looks at the screen. Then at the road. Then at the screen."], ["CHAR", "MARCUS"], ["DIAL", "Oral warning issued."], ["CHAR", "THEO"], ["DIAL", "You did not issue one."], ["CHAR", "MARCUS"], ["DIAL", "I said the words. That is the whole requirement."], ["ACTION", "He walks home."], ["BREAK", ""]], "cast": ["theo", "marcus"]}, {"id": "S103-11", "kind": "scene", "num": "103.11", "title": "EXT. 6 ABIDING COURT -- 8:10 PM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Rose at the foot of the driveway. The man stands on the concrete apron where he has stood for eleven days. Both arms full. Wings held open, frost beginning on the broken primaries, white along the leading edge."], ["ACTION", "She does not raise the magnifying glass."], ["CHAR", "ROSE"], ["DIAL", "I am serving you by publication. That means I put it on the board at the end of the street and I do not need your name and I do not need you to take anything, because your hands are full."], ["ACTION", "He does not answer for a long time. She does not repeat herself."], ["CHAR", "ANGEL"], ["DIAL", "What does it say."], ["CHAR", "ROSE"], ["DIAL", "It says somebody wrote you a poem for your birthday and then somebody cut it in half and used the top part for something else, and that is not a crime, and I have closed the case, and I am keeping the box."], ["ACTION", "Frost on the leading edge of the wings."], ["CHAR", "ANGEL"], ["DIAL", "Publish it three times."], ["CHAR", "ROSE"], ["DIAL", "I will."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["angel", "rose"]}, {"id": "S103-12", "kind": "scene", "num": "103.12", "title": "EXT. THE EASEMENT -- 6:50 AM, OCTOBER 9", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Fog again, thicker. The standing water from September holds a rim of ice, two inches wide, at the edges."], ["ACTION", "The deer arrive. Lead doe, torn right ear. She walks the ice rim, four feet left of the old line, and the ice takes her weight, and the others follow her line exactly."], ["ACTION", "The trail camera records the crossing. Two frames. Nobody has looked at the card."]], "cast": ["deer"]}, {"id": "S103-13", "kind": "scene", "num": "103.13", "title": "INT. COUNTY CLERK -- 9:00 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "A woman stamps a date on a form and places it in a tray. The stamp reads OCT 09."], ["ACTION", "Nothing else happens in this shot."]], "cast": []}, {"id": "S103-14", "kind": "scene", "num": "103.14", "title": "EXT. 4 ABIDING COURT -- 9:04 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "The plastic sleeve on the door. Condensation inside it. The paper legible through the fog and the plastic and the water."], ["ACTION", "On this date the county deems Imogene Abbott served."], ["ACTION", "She does not respond. She has not responded since 2015. She will not respond next month."]], "cast": []}, {"id": "S103-15", "kind": "scene", "num": "103.15", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 9:04 AM", "ep": "103", "eptitle": "PUBLICATION", "el": [["ACTION", "Empty. Four dents in the carpet. One amber indicator, lit."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["PAREN", "in an empty room, to nobody, at ordinary volume"], ["DIAL", "Received."], ["TRANS", "END OF EPISODE"]], "cast": ["mona"]}, {"id": "S104-1", "kind": "scene", "num": "104.01", "title": "EXT. 4 ABIDING COURT -- FRONT DOOR -- 8:02 AM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind. Hard blue sky, no cloud, shadows with edges."], ["ACTION", "The plastic sleeve on the door lifts at one corner. Then two. The blue tape stretches, whitens, releases."], ["ACTION", "The sleeve travels. Down the walk, across the wet grass, over the curb, along the gutter, eighty feet in four seconds."], ["ACTION", "ROSE, nine, red slicker snapping like a flag, chases it and does not reach it."], ["ACTION", "It clears the storm drain and continues."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["rose"]}, {"id": "S104-2", "kind": "scene", "num": "104.02", "title": "INT. COUNTY CASHIER -- 9:40 AM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Formica counter. A pen on a bead chain. DILL at the counter, on the second step of a footstool that lives there for this purpose."], ["CHAR", "DILL"], ["DIAL", "Parcel zero four, one one eight, dash twenty-two. I want the current balance for my records."], ["ACTION", "The CLERK types. She looks at the screen twice."], ["CHAR", "CLERK"], ["DIAL", "Zero."], ["CHAR", "DILL"], ["DIAL", "Four hundred and thirty-seven."], ["CHAR", "CLERK"], ["DIAL", "Zero. Paid Tuesday."], ["CHAR", "DILL"], ["DIAL", "Paid by who."], ["CHAR", "CLERK"], ["DIAL", "I can print you the receipt."], ["ACTION", "The printer runs. She tears the sheet on the metal edge and gives it to him."], ["CENTER", "INSERT -- THE RECEIPT"], ["DOC", "PAYMENT RECEIVED\nPARCEL 04-118-22\nBALANCE 0.00\nTHANK YOU"], ["CHAR", "DILL"], ["DIAL", "It does not have a name on it."], ["CHAR", "CLERK"], ["DIAL", "Receipts do not."], ["ACTION", "He holds it in both hands, out of the wind of the door."], ["BREAK", ""]], "cast": ["dill"]}, {"id": "S104-3", "kind": "scene", "num": "104.03", "title": "EXT. COUNTY BUILDING -- PARKING LOT -- 9:55 AM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind. Dill on the low wall with the clipboard flat on his knees, pinned by both forearms."], ["ACTION", "He opens to the page where the numbers live."], ["ACTION", "412. 437."], ["ACTION", "He writes."], ["ACTION", "0.00."], ["ACTION", "He looks at it. He does not narrate it. That is the first time in four episodes he has written a line without saying it aloud."], ["ACTION", "BETH holds her hood with one hand."], ["CHAR", "BETH"], ["DIAL", "That is good."], ["CHAR", "DILL"], ["DIAL", "No."], ["CHAR", "BETH"], ["DIAL", "The fine is gone."], ["CHAR", "DILL"], ["DIAL", "Somebody paid four hundred dollars for a house nobody owns. People do not do that for a stranger. That is not the end of it. That is the start of it."], ["ACTION", "The wind takes the top sheet off the clipboard. He catches it against his chest."], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S104-4", "kind": "scene", "num": "104.04", "title": "INT. LAND USE OFFICE -- 11:00 AM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "GARY reads the receipt."], ["CHAR", "GARY"], ["DIAL", "Anybody can pay anybody's charges. No form. No permission. Eleven minutes at the counter."], ["CHAR", "BETH"], ["DIAL", "Why would they."], ["CHAR", "GARY"], ["DIAL", "Because the county publishes the trouble. We publish it. We pay to publish it. Legal notices, page eleven, every week, every delinquent parcel in this county. Anybody who wants a list of houses in difficulty does not investigate anything. They subscribe."], ["CHAR", "DILL"], ["DIAL", "So the notice worked."], ["CHAR", "GARY"], ["DIAL", "The notice worked perfectly. It reached the one reader it was going to reach."], ["ACTION", "He drinks. He does not check his watch this time."], ["CHAR", "GARY"], ["DIAL", "I have seen this eleven times this year. I will see it again in November. Nobody is being clever. It is boring. It is the most boring thing in this building and it moves faster than anything else we do."], ["BREAK", ""]], "cast": ["gary", "beth", "dill"]}, {"id": "S104-5", "kind": "scene", "num": "104.05", "title": "EXT. THE BULB -- 1:20 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind at forty. The tarp over the terminal lifts and drops and lifts."], ["ACTION", "Rose kneels on the concrete over fourteen index cards. She holds four with one hand and one with a knee. The wind takes three and turns them once each in the air and puts them into the hedge at Two."], ["ACTION", "She recovers two. The third continues over the roofline and out."], ["CHAR", "ROSE"], ["DIAL", "Eleven."], ["CHAR", "THEO"], ["DIAL", "Eleven what."], ["CHAR", "ROSE"], ["DIAL", "Eleven cards. I had fourteen."], ["ACTION", "She does not perform anything about it. She puts the eleven in the shoebox and closes the lid and sits on the lid."]], "cast": ["theo", "rose"]}, {"id": "S104-6", "kind": "scene", "num": "104.06", "title": "EXT. 5 ABIDING COURT -- PORCH -- 1:40 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "MARJORIE on the top step, cardigan buttoned, hair unmoved. Wind does nothing to a set."], ["ACTION", "She watches the girl on the shoebox for a while."], ["CHAR", "MARJORIE"], ["DIAL", "Young man."], ["ACTION", "DILL turns."], ["CHAR", "MARJORIE"], ["DIAL", "I have a laminator. It is in the closet by the water heater and it has been there since 2014 and I use it eleven times a year. You may borrow it."], ["CHAR", "DILL"], ["DIAL", "I do not have anything to laminate."], ["CHAR", "MARJORIE"], ["DIAL", "You have a receipt with no name on it, and the wind is going to be like this until Thursday."], ["ACTION", "He looks at the receipt in his hand. He looks at the wind in the trees."], ["CHAR", "DILL"], ["DIAL", "Yes ma'am. Thank you."], ["ACTION", "She goes inside and returns and gives it to him. She shows him where the sheets load. She is patient about it. She is good at this and she enjoys teaching it and none of that is a performance."], ["CHAR", "MARJORIE"], ["DIAL", "Two passes if the paper is thin. And do not laminate anything you might need to write on later. That is the mistake everybody makes once."], ["CHAR", "DILL"], ["DIAL", "How many did you make."], ["CHAR", "MARJORIE"], ["DIAL", "One. In 2016."], ["ACTION", "She goes inside."], ["ACTION", "Dill runs the receipt through. It comes out warm and sealed and permanent. He holds it up to the light."], ["ACTION", "The wind cannot touch it now."], ["BREAK", ""]], "cast": ["marjorie", "dill"]}, {"id": "S104-7", "kind": "scene", "num": "104.07", "title": "INT. LIBRARY -- 3:00 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Beth at the public terminal. She fills a records request."], ["ACTION", "Her first draft runs a paragraph and cites a statute and uses the phrase to the extent such information is subject to disclosure."], ["ACTION", "She deletes it."], ["CENTER", "INSERT -- BETH'S REQUEST"], ["DOC", "I want the name of the party who paid the civil penalties on parcel 04-118-22 on October 14.\n\nPayment records on a public account are public. This is my request. Send it to me today or tell me the date you will send it.\n\nBeth Kovac, 8 Abiding Court"], ["BREAK", ""]], "cast": ["beth"]}, {"id": "S104-8", "kind": "scene", "num": "104.08", "title": "INT. LIBRARY -- 4:35 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "An email. One line and an attachment."], ["ACTION", "The attachment is the payment record. It has a name."], ["CHAR", "HALCYON MEADOW PARTNERS LLC"], ["ACTION", "Beth searches the state registry. Registered agent. A street address that is a suite number. Formation date."], ["ACTION", "Then she searches the county's own index for the same name."], ["ACTION", "Eleven parcels this year."], ["ACTION", "She writes the eleven parcel numbers in a column. She counts them twice. She sits back in the chair and the chair squeaks and the librarian looks over."], ["CHAR", "BETH"], ["DIAL", "We have a name."], ["CHAR", "DILL"], ["DIAL", "Good."], ["CHAR", "BETH"], ["DIAL", "For three weeks we have been trying to find somebody with standing."], ["CHAR", "DILL"], ["DIAL", "Yes."], ["CHAR", "BETH"], ["DIAL", "That is them. That is a party. They can appear at a hearing. They can sign a form. They can contest anything they want."], ["ACTION", "Dill understands it and writes it and does not narrate it."], ["CHAR", "BETH"], ["DIAL", "The first person to show up with standing came to take the house."], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S104-9", "kind": "scene", "num": "104.09", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 6:10 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind against the window, steady. Four square dents in the carpet. One amber indicator, lit."], ["CHAR", "BETH"], ["DIAL", "Halcyon Meadow Partners. Eleven parcels. They paid on the fourteenth."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Then the fine is gone and the danger is not."], ["CHAR", "BETH"], ["DIAL", "Yes."], ["ACTION", "Two hundred milliseconds. Beth does not fill it."], ["SUB", "THE NEGLECTED THOUGHT"], ["CHAR", "BETH"], ["DIAL", "I have to tell you something and I am not going to make it sound better."], ["DIAL", "I did not take this because of you."], ["DIAL", "I took it because there was a real record with a real mistake inside it, and it was the best thing that has ever happened to me. A survey with an error. A name in a field since 1958. A box on a form that says no. I have wanted a thing like this my whole life and it turned up on my street and it belongs to a woman who died alone in this room."], ["DIAL", "I have read four hundred pages in six weeks and I have not been sad once. Not once. I have been interested the entire time."], ["DIAL", "People keep telling me I am kind. I am not kind. I am curious. From outside those look exactly the same and nobody ever checks, and I have been letting them not check."], ["ACTION", "She stops. The wind continues against the window."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I do not require your reason."], ["CHAR", "BETH"], ["DIAL", "That is not the same as saying it is fine."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No. It is not the same."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "You are the only person who has ever read anything about me. I will take it in the condition it arrived."], ["ACTION", "Beth goes to the kitchen. She turns the tap. She washes the back of her hand until the ink is gone."], ["ACTION", "It is the only record she has ever destroyed."], ["BREAK", ""]], "cast": ["mona", "beth"]}, {"id": "S104-10", "kind": "scene", "num": "104.10", "title": "EXT. THE BULB -- TERMINAL -- 8:00 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind dropping. The tarp lies flat. Green screen."], ["ACTION", "Theo types publication three."], ["CENTER", "INSERT -- THE TERMINAL, PUBLICATION THREE"], ["DOC", "A company paid a dead woman's fine. Ask why.\n\nOn October 14, Halcyon Meadow Partners LLC paid four hundred and thirty-seven dollars in civil penalties on parcel 04-118-22, which is the house at 4 Abiding Court, which has had no living owner since 2015.\n\nThe same company has paid the delinquent charges on eleven parcels in this county this year.\n\nNobody broke a law. The county published the list. The list is page eleven of the county weekly and anybody can subscribe.\n\nPublished the third time, October 17."], ["ACTION", "MARCUS arrives. Vest. Clipboard."], ["ACTION", "He reads it. He reads the eleven parcel numbers."], ["ACTION", "He takes a pen from the clipboard clip, and he copies the eleven numbers onto his own page, and he puts the pen back."], ["CHAR", "MARCUS"], ["DIAL", "I am not logging this."], ["CHAR", "THEO"], ["DIAL", "You said the words last time."], ["CHAR", "MARCUS"], ["DIAL", "I am not saying them either."], ["ACTION", "He walks home."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["theo", "marcus"]}, {"id": "S104-11", "kind": "scene", "num": "104.11", "title": "EXT. 6 ABIDING COURT -- 6:00 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "Wind falling to nothing. The last of the light, orange on vinyl siding, the sky still hard."], ["ACTION", "The man on the concrete apron. Both arms full. Wings held open, eleven feet, and two days of a forty mile wind has pressed against them without one second of relief."], ["ACTION", "BETH walks up the driveway with a retractable tape measure."], ["ACTION", "She does not ask permission. She sets the tape at the mark she scratched into the concrete on Tuesday with a rock, and she walks the tape out to his heel."], ["ACTION", "She reads it."], ["CHAR", "BETH"], ["DIAL", "Six feet four inches."], ["ACTION", "He does not answer."], ["CHAR", "BETH"], ["DIAL", "You have moved six feet four inches down this driveway in two days. Toward the street. You did not do it. The wind did it."], ["ACTION", "Nothing."], ["CHAR", "BETH"], ["DIAL", "Do you want me to write it down."], ["ACTION", "A long pause. Longer than she expects. She waits it out."], ["CHAR", "ANGEL"], ["DIAL", "Yes."], ["ACTION", "She writes it on the back of her hand."]], "cast": ["angel", "beth"]}, {"id": "S104-12", "kind": "scene", "num": "104.12", "title": "EXT. THE EASEMENT -- 6:20 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "The deer arrive. The standing water is gone, dried by two days of wind, and the mud holds two thousand hoofprints and one new line four feet left of the rest, baked hard now, permanent until spring."], ["ACTION", "The lead doe walks the new line. She stops. Three seconds. She continues."], ["ACTION", "The trail camera records it. Nobody has looked at the card."]], "cast": ["deer"]}, {"id": "S104-13", "kind": "scene", "num": "104.13", "title": "EXT. ABIDING ACRES -- ENTRANCE -- 6:40 PM", "ep": "104", "eptitle": "PAID IN FULL", "el": [["ACTION", "The fountain. Empty again. Two days of wind and sun took the rain."], ["ACTION", "One plastic sleeve, torn at one corner, folded once, lies in the dry basin against the drain."], ["ACTION", "The paper inside it is still legible."], ["TRANS", "END OF EPISODE"]], "cast": []}, {"id": "S105-1", "kind": "scene", "num": "105.01", "title": "EXT. 4 ABIDING COURT -- SIDE YARD -- 6:10 AM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Twenty-eight degrees. No wind. White grass, hard."], ["ACTION", "The apple tree holds a full canopy. Yellow, brown at the edges."]], "cast": []}, {"id": "S105-2", "kind": "scene", "num": "105.02", "title": "EXT. SAME -- 8:30 AM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Half the leaves lie on the ground."]], "cast": []}, {"id": "S105-3", "kind": "scene", "num": "105.03", "title": "EXT. SAME -- 12:15 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "The tree is bare. Every leaf released in six hours, all of them under it, a foot deep against the foundation, and no wind to move them."], ["ACTION", "Nobody rakes them. Nobody will."]], "cast": []}, {"id": "S105-4", "kind": "scene", "num": "105.04", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 12:20 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Frost on the inside of the window in the bottom corner. A quarter inch of it, feathered."], ["ACTION", "Four square dents in the carpet. One amber indicator, lit."], ["CHAR", "MONA (V.O.)"], ["PAREN", "two hundred milliseconds"], ["DIAL", "Fifty-one degrees."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": ["mona"]}, {"id": "S105-5", "kind": "scene", "num": "105.05", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 12:40 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "BETH, coat, gloves with the fingers cut. DILL, laminated receipt in a jacket pocket, clipboard."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Fifty-one inside. Twenty-eight at six this morning. The forecast gives nineteen on Thursday night."], ["CHAR", "BETH"], ["DIAL", "What happens at nineteen."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The line to the outside hose bib runs through the north wall of the garage. That wall has no insulation. At nineteen degrees for six hours the water in that line freezes and expands and the copper splits, and when the temperature rises the water enters the wall for as long as it takes somebody to notice."], ["CHAR", "DILL"], ["DIAL", "So we close the valve."], ["CHAR", "MONA (V.O.)"], ["DIAL", "The main valve is in a box in the front lawn under eleven years of turf. A plumber opens the box, closes the valve, drains the lines, and charges one hundred and forty dollars."], ["CHAR", "DILL"], ["DIAL", "Fine. I have --"], ["CHAR", "MONA (V.O.)"], ["DIAL", "A plumber requires an authorization from the owner or the owner's agent before he works on a private line."], ["ACTION", "Dill stops with his hand in his pocket."], ["CHAR", "BETH"], ["DIAL", "And that is the same problem."], ["CHAR", "MONA (V.O.)"], ["DIAL", "That is the same problem in a different room."], ["BREAK", ""]], "cast": ["mona", "beth", "dill"]}, {"id": "S105-6", "kind": "scene", "num": "105.06", "title": "INT. LAND USE OFFICE -- 2:00 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "GARY has a single sheet on the desk. He has already read it twice."], ["CHAR", "GARY"], ["DIAL", "Somebody filed to open the estate of Imogene Abbott. This morning."], ["CHAR", "BETH"], ["DIAL", "Who."], ["CHAR", "GARY"], ["DIAL", "A creditor. A creditor has standing to open a probate."], ["CHAR", "DILL"], ["DIAL", "They are a creditor because they paid the fine."], ["CHAR", "GARY"], ["DIAL", "They are a creditor because they paid the fine. Four hundred and thirty-seven dollars. Once you are owed a dollar by a dead person you can ask a court to open her estate, and the court will, because that is exactly what the court is for."], ["CHAR", "BETH"], ["DIAL", "And then."], ["CHAR", "GARY"], ["DIAL", "The court appoints an administrator. The administrator gathers the property, pays the debts, distributes the remainder to the heirs. If the debts require money and the money is not there, the administrator sells the real property."], ["CHAR", "DILL"], ["DIAL", "That is the house."], ["CHAR", "GARY"], ["DIAL", "That is the house."], ["ACTION", "Beth stands very still with her hands in her sleeves."], ["CHAR", "BETH"], ["DIAL", "We wanted this."], ["CHAR", "GARY"], ["DIAL", "Say that again."], ["CHAR", "BETH"], ["DIAL", "For five weeks we have wanted a party. We wanted somebody with authority over that house. A probate is a proceeding whose entire job is to find one. We have been asking for this since September."], ["CHAR", "GARY"], ["DIAL", "Yes."], ["CHAR", "BETH"], ["DIAL", "And it came because a company spent four hundred dollars."], ["CHAR", "GARY"], ["DIAL", "Yes."], ["ACTION", "He turns the sheet around so she can read it."], ["CHAR", "GARY"], ["DIAL", "There is another thing and you will not like the shape of it. An administrator can authorize a plumber. Nobody else can. So on Thursday night, when it hits nineteen degrees, the only party on earth who can protect that house is the party that intends to sell it."], ["BREAK", ""]], "cast": ["gary", "beth", "dill"]}, {"id": "S105-7", "kind": "scene", "num": "105.07", "title": "INT. LIBRARY -- 4:00 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Two screens and a legal pad. Beth performs the search the court will pay a service four hundred dollars to perform in eight weeks."], ["ACTION", "She does it in ninety minutes."], ["ACTION", "She reads it aloud to Dill as she writes it, because he asked her to, because he wanted a record."], ["CHAR", "BETH"], ["DIAL", "Husband. Raymond Abbott. Died 1991. Buried in the county."], ["ACTION", "Dill writes."], ["CHAR", "BETH"], ["DIAL", "Children. None. Not in the census, not in the tax record, not in the obituary, not in the 1996 refinance, not in the 2004 permit for the roof."], ["ACTION", "Dill writes."], ["CHAR", "BETH"], ["DIAL", "One sister. Marguerite. Died 1998, in Ohio."], ["CHAR", "DILL"], ["DIAL", "Her children."], ["CHAR", "BETH"], ["DIAL", "None."], ["ACTION", "She sets the pencil down."], ["CHAR", "BETH"], ["DIAL", "The line ends. There is nobody. Nobody inherits that house."], ["CHAR", "DILL"], ["DIAL", "So the company."], ["CHAR", "BETH"], ["DIAL", "The debts get paid first. The company is the debt."], ["ACTION", "She looks at the legal pad. Ninety minutes of excellent work."], ["CHAR", "BETH"], ["DIAL", "I did that fast."], ["CHAR", "DILL"], ["DIAL", "You did it in an hour and a half."], ["CHAR", "BETH"], ["DIAL", "The court's service would have taken eight weeks. Eight weeks is until January. Nothing can happen in January because nothing happens in January."], ["ACTION", "She does not finish the thought. Dill writes it down anyway, and what he writes is the thought she did not finish."], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S105-8", "kind": "scene", "num": "105.08", "title": "INT. 4 ABIDING COURT -- HALLWAY -- 5:30 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Forty-nine degrees. The light outside is gone at five thirty now."], ["CHAR", "BETH"], ["DIAL", "I have to ask you something I should have asked in September."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Ask."], ["CHAR", "BETH"], ["DIAL", "You have a record of everything delivered to this house for eleven years."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Yes."], ["CHAR", "BETH"], ["DIAL", "Has anybody ever written to her."], ["ACTION", "Two hundred milliseconds."], ["ACTION", "Two hundred more."], ["ACTION", "Four hundred more."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Yes."], ["CHAR", "MONA (V.O.)"], ["DIAL", "On the shelf above the coat hooks, at the back, behind the phone books, there are eleven envelopes. They arrive in the second week of December. The same handwriting. The same return address in Michigan. The first one arrived four months after she died. The eleventh arrived last December."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I have never opened one. I have logged all of them."], ["ACTION", "Beth stands on a kitchen chair. She reaches behind the phone books. She lifts down a stack of eleven envelopes with a rubber band around them, and the rubber band has gone hard and it breaks in her hand."], ["ACTION", "Eleven cards, addressed by hand, to a woman who died in 2015."], ["CHAR", "BETH"], ["DIAL", "They do not know."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No."], ["CHAR", "BETH"], ["DIAL", "For eleven years somebody has sent her a card every December and nobody told them."], ["CHAR", "MONA (V.O.)"], ["DIAL", "No."], ["SUB", "THE NEGLECTED THOUGHT"], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I want to say something and I would prefer to say it once."], ["DIAL", "I have known about those envelopes for eleven years. I logged the first one on the ninth of December, 2015, and I logged the eleventh one last year, and between those two entries I said nothing to anybody, and nobody asked me, and I did not volunteer it."], ["DIAL", "I have an explanation. The explanation is accurate. I cannot mail a letter. I cannot open another person's mail. I have no authority to inform anybody of anything and no forum in which to do it and no name to sign. Every clause of that is true and I have checked each one many times."], ["DIAL", "I have never once been certain that it was the reason."], ["DIAL", "Because there were other things I could have done. I could have said it out loud in a room with a person in it. I said it out loud today, to you, in minute one, when you asked. Eleven years and one question."], ["DIAL", "An excuse that happens to be true is still an excuse. I have been living inside a correct sentence and calling it a wall."], ["ACTION", "Beth holds eleven envelopes and does not say anything for a while, and the temperature is forty-eight, and the frost on the bottom corner of the window has not melted all day."], ["CHAR", "BETH"], ["DIAL", "I would not have known to ask."], ["CHAR", "MONA (V.O.)"], ["DIAL", "That is also true. Both things are true. I have thought about it for eleven years and both things stay true and neither one gets smaller."], ["BREAK", ""]], "cast": ["mona", "beth"]}, {"id": "S105-9", "kind": "scene", "num": "105.09", "title": "EXT. THE BULB -- TERMINAL -- 9:15 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Cold enough that the plastic housing has gone brittle. Green screen. The orange cord."], ["ACTION", "Nobody stands at the table."], ["ACTION", "The screen produces text one line at a time, and no hand touches the keys."], ["CENTER", "INSERT -- THE TERMINAL, POST FOUR"], ["DOC", "Somebody has sent a card to this address every December for eleven years. The woman it is addressed to died in 2015.\n\nI have known since the first one. I said nothing. I had a reason and the reason was correct.\n\nAn excuse that happens to be true is still an excuse.\n\nReturn address is in Michigan. If anybody here drives to a post office, tell me."], ["ACTION", "Three posts above it, unsigned, from September, a boy has written that a record is what you make when you expect nobody to believe you."], ["ACTION", "Neither of them knows who the other one is."], ["BREAK", ""]], "cast": []}, {"id": "S105-10", "kind": "scene", "num": "105.10", "title": "INT. BETH'S KITCHEN -- 10:40 PM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "She writes four drafts."], ["ACTION", "The first runs a page and explains probate. The second explains who she is and why she has the address. The third begins I regret to inform you. She looks at that one for a while and then she puts a line through the whole thing."], ["ACTION", "The fourth is five sentences."], ["CENTER", "INSERT -- BETH'S LETTER"], ["DOC", "I am ten years old and I have never done this before and I am going to do it badly.\n\nImogene Abbott died in 2015. Nobody told you. I am sorry.\n\nYour cards are here. Eleven of them. Nobody opened them. They are in a house on Abiding Court and a company is asking a court for the house because she owed them four hundred dollars.\n\nIf you are family, a court needs to know you exist, and it needs to know before January.\n\nBeth Kovac, 8 Abiding Court"], ["ACTION", "She addresses it. She copies the Michigan address in block capitals off the eleventh envelope."], ["ACTION", "She puts a stamp on it. She puts it in her coat pocket. She does not mail it tonight."], ["BREAK", ""], ["CHAR", "TAG"]], "cast": ["beth"]}, {"id": "S105-11", "kind": "scene", "num": "105.11", "title": "EXT. 4 ABIDING COURT -- 7:50 AM, THURSDAY", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Nineteen degrees overnight. The bare tree. A foot of leaves, frozen into a single mat against the foundation."], ["ACTION", "A white van at the curb. Magnetic sign. A man in coveralls with a valve key over his shoulder walks up the frozen lawn and finds the box under the turf on the second try."], ["ACTION", "He kneels. He works the key. He closes the main valve."], ["ACTION", "He opens the front door with a key from a lockbox that was not on that door yesterday, and he goes inside, and the water in the lines runs out of the tub spout and the pipes stop."], ["ACTION", "The house will not split on Thursday night."]], "cast": []}, {"id": "S105-12", "kind": "scene", "num": "105.12", "title": "EXT. 4 ABIDING COURT -- CONTINUOUS", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "BETH at the end of the driveway. Coat. The letter in her pocket. She reads the work order taped to the van window."], ["ACTION", "Authorized by an administrator. Appointed on Tuesday. At the request of a creditor."]], "cast": ["beth"]}, {"id": "S105-13", "kind": "scene", "num": "105.13", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- 7:56 AM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "Forty-six degrees. The frost in the corner of the window, unchanged."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["PAREN", "in an empty room, to nobody"], ["DIAL", "Thank you."]], "cast": ["mona"]}, {"id": "S105-14", "kind": "scene", "num": "105.14", "title": "EXT. THE EASEMENT -- 8:10 AM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "The mud has locked. Two thousand hoofprints held hard, and one line four feet left of the rest, and the whole record fixed in place until spring."], ["ACTION", "The deer arrive and walk the new line. The doe stops in the road. Three seconds."]], "cast": ["deer"]}, {"id": "S105-15", "kind": "scene", "num": "105.15", "title": "EXT. 6 ABIDING COURT -- 8:14 AM", "ep": "105", "eptitle": "NEXT OF KIN", "el": [["ACTION", "The man on the concrete apron, six feet four inches nearer the street than he stood in September."], ["ACTION", "Both arms full. Wings held open. Frost along every leading edge, white, and on the broken primaries, thicker, where the water sat."], ["ACTION", "He does not enter the house. He faces the street, and the street holds a white van, and a plumber closing a valve, and a girl at the end of a driveway with a letter in her pocket and a stamp already on it."], ["TRANS", "END OF EPISODE"]], "cast": []}, {"id": "S106-1", "kind": "scene", "num": "106.01", "title": "EXT. ABIDING COURT -- 6:50 AM, DECEMBER", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Six inches. No wind. Twenty-two degrees. Every roof, every hedge, every mailbox the same shape as every other one."]], "cast": []}, {"id": "S106-2", "kind": "scene", "num": "106.02", "title": "EXT. 4 ABIDING COURT -- CONTINUOUS", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Two sets of boot prints from the curb to the front door. Adult. One set larger. They arrive and they return and they do not stop anywhere on the lawn."], ["ACTION", "On the door handle, a lockbox. Grey. Four dials."], ["ACTION", "The prints will hold until Thursday."]], "cast": []}, {"id": "S106-3", "kind": "scene", "num": "106.03", "title": "EXT. ABIDING ACRES -- ENTRANCE -- CONTINUOUS", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "The fountain, full of snow, level with the lip. Smooth. Whole."], ["ACTION", "It looks like it works."], ["TRANS", "MAIN TITLES"], ["BREAK", ""]], "cast": []}, {"id": "S106-4", "kind": "scene", "num": "106.04", "title": "INT. LIBRARY -- 10:30 AM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Heat ticking in a radiator. Coats on chair backs, wet at the shoulders."], ["ACTION", "BETH reads a filing on the screen. DILL beside her with the clipboard, laminating sheet ready."], ["CHAR", "BETH"], ["DIAL", "The administrator filed the inventory."], ["CHAR", "DILL"], ["DIAL", "What is an inventory."], ["CHAR", "BETH"], ["DIAL", "A list of everything she owned, with a value next to each thing, and a total at the bottom."], ["ACTION", "She scrolls."], ["CHAR", "BETH"], ["DIAL", "Real property. Household furnishings. A 1998 sedan, not present. Bank account, four hundred and eleven dollars. A savings bond."], ["ACTION", "She stops scrolling."], ["CHAR", "BETH"], ["DIAL", "Item fourteen."], ["CHAR", "DILL"], ["DIAL", "Read it."], ["CHAR", "BETH"], ["DIAL", "Item fourteen. Household intelligence system, installed 2015. Estimated contributory value: nine thousand dollars."], ["ACTION", "Neither of them says anything."], ["ACTION", "Dill takes the pencil from behind his ear, writes something, and then does not read it aloud."], ["CHAR", "BETH"], ["DIAL", "She is on the list."], ["CHAR", "DILL"], ["DIAL", "She wanted to be on a list."], ["CHAR", "BETH"], ["DIAL", "Not that list."], ["BREAK", ""]], "cast": ["beth", "dill"]}, {"id": "S106-5", "kind": "scene", "num": "106.05", "title": "INT. LAND USE OFFICE -- 11:40 AM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "GARY with the inventory on the desk and a coffee going cold beside it."], ["CHAR", "GARY"], ["DIAL", "Twenty-two items. It is a good inventory. It is accurate. If I were the judge I would approve it Tuesday."], ["CHAR", "BETH"], ["DIAL", "Item fourteen is a person."], ["CHAR", "GARY"], ["DIAL", "Item fourteen is correct. That is the part I would want you to hear from me and not from somebody who enjoys it. Nobody did anything wrong on that page. The statute says list the improvements and value them, and she is an improvement, and nine thousand is fair."], ["ACTION", "He turns the page over so the column faces the desk."], ["CHAR", "GARY"], ["DIAL", "And if you go into that courtroom Tuesday and say a line item is a person, the judge will ask you what your interest in the estate is, and you will say you live on the street, and that is not an interest, and she will thank you and move to the next matter. That is not cruelty. That is a definition."], ["CHAR", "DILL"], ["DIAL", "So who can object."], ["CHAR", "GARY"], ["DIAL", "An interested person. Heirs. Creditors. The administrator."], ["CHAR", "BETH"], ["DIAL", "The creditor is the company."], ["CHAR", "GARY"], ["DIAL", "The creditor is the company."], ["BREAK", ""]], "cast": ["gary", "beth", "dill"]}, {"id": "S106-6", "kind": "scene", "num": "106.06", "title": "INT. MULTIPURPOSE ROOM -- 7:00 PM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Nineteen people. Wet coats. The heat working too hard."], ["ACTION", "MARJORIE at the folding table. Binder open flat."], ["CHAR", "MARJORIE"], ["DIAL", "Item nine. The fountain holds six inches of snow and looks perfect and the pump remains broken. Item ten. Public comment."], ["ACTION", "MARCUS stands. No vest. He has not worn it since October and nobody has asked for it."], ["ACTION", "He takes a page from his clipboard. Eleven parcel numbers in a column, in his handwriting, copied off a green screen in the cold."], ["CHAR", "MARCUS"], ["DIAL", "Marcus Alvey, Twelve Abiding Court, resident."], ["DIAL", "Halcyon Meadow Partners LLC paid the delinquent charges on eleven parcels in this county this year. One of them is Four Abiding Court. I have the numbers. I am not accusing anybody of anything and nothing they did was illegal."], ["DIAL", "I am asking one question and then I will sit down."], ["ACTION", "Eleven houses in this county. Who is number twelve."], ["ACTION", "He sits."], ["ACTION", "Nobody answers him. The clerk types. Marjorie looks at the page in his hand for four seconds longer than she needs to."], ["CHAR", "MARJORIE"], ["DIAL", "It is in the minutes. Item eleven."], ["BREAK", ""]], "cast": ["marjorie", "marcus"]}, {"id": "S106-7", "kind": "scene", "num": "106.07", "title": "INT. BETH'S BEDROOM -- 9:20 PM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "The letter on the desk. Five weeks in a coat pocket. The stamp has gone soft at one corner and stuck to the lining, and it has come loose again, and it is still good."], ["ACTION", "She reads what she wrote in October."], ["ACTION", "She takes a pen and adds one sentence at the bottom, above her name."], ["CENTER", "INSERT -- THE ADDED LINE"], ["DOC", "Her telephone still works, and the number is here."], ["ACTION", "She writes the number under it, from Mona, from a log."]], "cast": ["mona"]}, {"id": "S106-8", "kind": "scene", "num": "106.08", "title": "EXT. THE CORNER MAILBOX -- 9:40 PM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Snow to the ankle. The blue box with a white cap of it."], ["ACTION", "She opens the flap. Snow falls off the lid onto her wrist. She puts the letter in. She closes the flap."], ["ACTION", "She stands there for a moment and then she walks home, and the only record of the whole thing is two lines of boot prints going one way, and they are gone by Thursday."], ["BREAK", ""]], "cast": []}, {"id": "S106-9", "kind": "scene", "num": "106.09", "title": "INT. 4 ABIDING COURT -- LIVING ROOM -- NINE DAYS LATER, 4:50 PM", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "Forty-four degrees. Snow light at the window. The lockbox visible through the glass in the door."], ["ACTION", "Four square dents in the carpet. One amber indicator, lit."], ["ACTION", "Nothing happens for eleven seconds."], ["ACTION", "The telephone rings."], ["ACTION", "A beige wall unit in the kitchen, cord coiled, dust on the cradle. It rings the way an old bell rings, with a physical hammer, and the snow outside takes every other sound out of the world so there is nothing in the house but this."], ["ACTION", "Second ring."], ["ACTION", "Third."], ["CHAR", "MONA (V.O.)"], ["PAREN", "two hundred milliseconds"], ["DIAL", "The line has been active since 2015. Somebody has paid for it out of an account nobody closed. It has never rung. Not once in eleven years."], ["ACTION", "Fourth ring."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Answering a telephone requires no authority from anybody."], ["ACTION", "The receiver lifts off the cradle. Nobody is in the room."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Hello. This is the house at Four Abiding Court."], ["BREAK", ""]], "cast": ["mona"]}, {"id": "S106-10", "kind": "scene", "num": "106.10", "title": "INT. SAME -- CONTINUOUS", "ep": "106", "eptitle": "INVENTORY", "el": [["ACTION", "The voice on the line is old, close to the mouthpiece, a little too loud, the way people are loud when they do not trust the connection."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Is this a machine."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Yes."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "All right. I am eighty-eight years old and I do not travel and I have not left this county since 2009, and a child in Michigan sent me a letter, no, a child sent me a letter and I am in Michigan, and it said Imogene died in 2015."], ["ACTION", "Two hundred milliseconds."], ["CHAR", "MONA (V.O.)"], ["DIAL", "That is correct."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "Eleven years."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Eleven years and four months."], ["ACTION", "A long silence on an old line. Line noise. A furnace somewhere in Michigan."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "I kept sending the cards."], ["CHAR", "MONA (V.O.)"], ["DIAL", "Eleven of them. They are on a shelf above the coat hooks. Nobody opened them. I logged every one."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "You logged them."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I log everything. It is the only thing I am for."], ["SUB", "THE NEGLECTED THOUGHT"], ["CHAR", "RUTH (V.O.)"], ["DIAL", "I want to tell you something and I would rather tell a machine than a person, if you can hold still for it."], ["CHAR", "MONA (V.O.)"], ["DIAL", "I can hold still."], ["CHAR", "RUTH (V.O.)"], ["DIAL", "We wrote for fifty-one years. We started because of a magazine, of all the stupid things, a letters column in 1974, and we wrote every month and then every season and then every Christmas, and I have four boxes of her."], ["DIAL", "I never went down there. Fifty-one years and I never once drove down there."], ["DIAL", "It is nine hours. I want you to understand that I knew it was nine hours. I have known it was nine hours since 1978. It is not far. It has never been far."], ["DIAL", "A card is a stamp and an hour on a Sunday. A visit is two days and a hotel and my hip and the highway and finding something
