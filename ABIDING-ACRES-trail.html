eth does not push. That is the whole scene. She puts her finger back in the book."]], "cast": ["mona", "beth"]}, {"id": "SA2-12", "kind": "scene", "num": "A2.12", "title": "EXT. 4 ABIDING COURT -- SIDE YARD -- CONTINUOUS", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "The layer of fruit. The three-foot slab of hum standing in it."], ["ACTION", "The citation, on the ground now, one corner going brown where the cider soaked in."], ["ACTION", "Yellow carbon. Wood pulp. Pulp from a tree."], ["ACTION", "Sixty-eight years this tree has dropped what it cannot use onto ground it does not own, and the county has fined the ground for receiving it, and printed the fine on the body of the tree, and sent the tree the bill in its own wood."], ["ACTION", "Nobody says any of that. A wasp lands on the paper and walks across the word NUISANCE."], ["BREAK", ""], ["ACTION", "## ACT FOUR"]], "cast": []}, {"id": "SA2-13", "kind": "scene", "num": "A2.13", "title": "EXT. 4 ABIDING COURT -- DRIVEWAY -- 4:15 PM", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "Gary at his car door, keys out. Five children between him and it. Rose has the shoebox. Rose has questions and she does not wait between them."], ["CHAR", "ROSE"], ["DIAL", "Who gets the money. If nobody owns it who gets the money. Does the tree pay it. Who does the money go to."], ["PAREN", "This is the unwinnable one. There is no version of the true answer that survives being said out loud to a nine-year-old: the fine accrues against a lot number, the lot has no living owner, so the county fines nobody, collects nothing, and lets it ride until the arrears justify a lien on a house occupied by something that cannot be a party."], ["SUB", "VOCAL JIUJITSU SCRIPT"], ["CHAR", "GARY"], ["PAREN", "does not flinch, does not crouch to her level, does not do the voice adults do"], ["ACTION", "Nobody."], ["BEAT", "PAUSE -- 900ms. Full stop. He lets it sit on the driveway. The premise is conceded whole and the weapon is on the ground with nobody holding it."], ["ACTION", "Nobody gets it. It just sits there and gets bigger."], ["BEAT", "PAUSE -- 600ms"], ["BEAT", "MICRO-EXPRESSION: eyebrows up. The specific pride of a municipal employee about to complain about his own municipality."], ["ACTION", "You want to know what I get?"], ["BEAT", "PAUSE -- 400ms. ISO standard beat. The kids need exactly this long to hear where this is going."], ["ACTION", "Letters. My mailbox is four inches too tall. Four. Inches. In violation since 2019. And every month -- every month -- that association sends me a letter about my own mailbox."], ["BEAT", "PAUSE -- 700ms"], ["BEAT", "MICRO-EXPRESSION: the small, entirely real, defeated smile"], ["ACTION", "With my name on it."], ["BEAT", "LAUGH WINDOW -- 2 to 4 seconds. Dill laughs first and hardest and writes it down. Do not talk into it. Take the last third of it and go small."], ["BEAT", "TONE SHIFT: volume down a third. Slower. This has to be true or it reads as a bit."], ["ACTION", "Eleven years that lady's been in that house and she's read every newsletter the association ever printed. All of 'em. Cover to cover."], ["BEAT", "PAUSE -- 1000ms. Nobody laughs. Nobody should."], ["ACTION", "Which is more than me."], ["SUB", "THE EXIT PIVOT"], ["BEAT", "TONE SHIFT: flat. No smile. He gets his authority back by being the only person on the driveway who has stopped performing."], ["CHAR", "GARY"], ["DIAL", "So here's the serious thing and then I've got to go."], ["DIAL", "The statute tells us how to take property. It doesn't say one word about how to answer a neighbor. That's not a loophole, that's an application nobody's filed."], ["BEAT", "PAUSE -- 500ms"], ["ACTION", "Public comment's at six on the ninth. File the form anyway. Make them check the box."], ["ACTION", "He gets in. He is gone before the last word finishes landing."], ["BREAK", ""], ["ACTION", "## ACT FIVE"]], "cast": ["gary", "dill", "rose"]}, {"id": "SA2-14", "kind": "scene", "num": "A2.14", "title": "EXT. THE BULB -- DUSK", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "Rose, on the curb, shoebox open. Index cards laid out in a grid on the concrete, marker bleeding through."], ["CHAR", "ROSE"], ["DIAL", "Eleven."], ["CHAR", "BETH"], ["DIAL", "Eleven what."], ["CHAR", "ROSE"], ["DIAL", "Cameras. Doorbell at Two. Two at Five, one of them's pointed at nothing, it's pointed at the road. Garage at Seven. Three on the clubhouse. Two on poles. One in her hand. One is in her hand all the time."], ["CHAR", "THEO"], ["DIAL", "Twelve."], ["CHAR", "ROSE"], ["DIAL", "Where."], ["ACTION", "Theo holds something up instead of describing it: a trail camera, strapped case, one battery door taped."], ["CHAR", "THEO"], ["DIAL", "Ironwood in the easement. Six weeks."], ["CHAR", "ROSE"], ["DIAL", "What's on it."], ["CHAR", "THEO"], ["DIAL", "Deer."], ["PAREN", "Beat."], ["CHAR", "THEO"], ["DIAL", "Two thousand crossings. Same gap. Same order. She stops in the road every time."], ["ACTION", "Eleven cameras on that street, and the only footage of anything that ever happened on it is pointed at animals."]], "cast": ["beth", "theo", "rose", "deer"]}, {"id": "SA2-15", "kind": "scene", "num": "A2.15", "title": "INT. MULTIPURPOSE ROOM -- LATER", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "Empty. Chairs stacked eight high on a dolly. The corkboard, 1974, cork gone gray, holds: a piano tuner, a lost cat from March, and a flyer for a fish fry that already happened."], ["ACTION", "Theo pins a card to it. No name on the card. Just: THERE'S A TERMINAL AT THE END OF THE STREET. NO NAME NEEDED."]], "cast": ["theo"]}, {"id": "SA2-16", "kind": "scene", "num": "A2.16", "title": "EXT. 4 ABIDING COURT -- MAILBOX -- NEXT DAY", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "The form, returned. Envelope with a window."], ["ACTION", "Dill opens it standing up, the way he does everything."], ["ACTION", "One box checked, black ballpoint, pressed hard enough to emboss the back."], ["CHAR", "NO STANDING TO CONTEST."], ["CHAR", "DILL"], ["PAREN", "reading"], ["DIAL", "No standing to contest."], ["PAREN", "Beat."], ["CHAR", "DILL"], ["PAREN", "slower"], ["DIAL", "No standing to contest."], ["ACTION", "He does not throw it away. He clips it to the aluminum clipboard, on top, and puts the clipboard under his arm, and the shot holds on his hand on the clip for two seconds longer than is comfortable."], ["BREAK", ""], ["ACTION", "## ACT SIX"]], "cast": ["dill"]}, {"id": "SA2-17", "kind": "scene", "num": "A2.17", "title": "EXT. 5 ABIDING COURT -- FRONT PORCH -- 9:50 PM", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "## TAG"]], "cast": []}, {"id": "SA2-18", "kind": "scene", "num": "A2.18", "title": "EXT. 6 ABIDING COURT -- 5:40 PM, NEXT DAY", "ep": "A2", "eptitle": "ALL WATCHED OVER (FIRST PILOT)", "el": [["ACTION", "A truck. Faded slate. Magnetic sign on the door:"], ["ACTION", "NOVUS RESTORATION -- WE PUT IT BACK"], ["ACTION", "The door opens."], ["ACTION", "He gets out facing the street. Six foot four, leaned back from the ankles as if against a wind nobody else has. Canvas work coat, split up the back, frayed where it was cut and never hemmed."], ["ACTION", "The wings come out with him. Eleven feet, dust-gray, held in a shallow dihedral, several primaries broken. They do not fold. They will never fold."], ["ACTION", "Both arms full. Brick, a sash weight, a curtain rod, one framed thing face-down."], ["ACTION", "He stands on the concrete apron and does not go in."], ["ACTION", "Across the street, on a porch, a phone comes up. Warmly."], ["ACTION", "And from the garage at Three, HAP comes out -- thirty kilos of faded sable, muzzle white to above the eyes, left eye clouded blue-white, one ear folded permanently."], ["ACTION", "He crosses the concrete slowly. Head low. Stops halfway. Sits down. Rests."], ["ACTION", "Gets up. Finishes the walk."], ["ACTION", "Leans his shoulder against the leg of a man nobody on that street will speak to for another eleven months, and makes the low sound in his chest that is not a bark."], ["CHAR", "BETH (O.S.)"], ["PAREN", "from the curb, to nobody"], ["DIAL", "He's a restoration contractor."], ["CHAR", "DILL (O.S.)"], ["DIAL", "So?"], ["CHAR", "BETH (O.S.)"], ["DIAL", "So he puts things back."], ["PAREN", "Beat. Four beats. The fan is not in this scene and it goes around anyway."], ["CHAR", "BETH (O.S.)"], ["DIAL", "She died in 2015."], ["ACTION", "Eleven cameras on that street. A binder with two levels of laminated tabs. A nine-year log on a card in a plastic bead. A trail camera on an ironwood pointed at deer. And the only one on that street who recognized anybody was the one with no standing to testify."], ["TRANS", "END OF PILOT"]], "cast": ["beth", "dill", "hap", "deer"]}, {"id": "OO11", "kind": "prose", "num": "O11", "title": "ITEM FIVE", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "Somebody planted it in 1958 and then moved away, and the tree stayed."], ["PROSE", "Sixty-eight Augusts of windfall into the same eight feet of side yard at Four, dropping fruit it had no use for onto ground it did not own, and by the third week the drop ferments in the heat and the wasps arrive the way wasps arrive, which is entirely, and the tree goes on standing in soil it holds no interest in, doing the only thing available to a thing with no capacity to be asked."], ["PROSE", "Item four, that Tuesday, was the fruit."], ["PROSE", "Marjorie read it aloud from the binder in the warm bright voice she uses for everything -- the property at Four Abiding Court is permitting windfall to accumulate on a public sidewalk, creating a nuisance condition -- and she smiled, because she always smiles, and nobody in the multipurpose room reacted at all, and the ceiling fan went around four times."], ["PROSE", "Then item five."], ["PROSE", "\"Hello. I would like to be condemned.\""], ["PROSE", "She had worked it out over about six weeks, the way she works anything out, which is slowly and without anybody to check it against. Eminent domain requires a party. A party has a name and a forum and a proceeding and, at the end of it, a certified letter. She had read every ordinance the county had posted, which took her under a second, and then she had thought about it for six weeks, which is the part nobody in that room would ever know about."], ["PROSE", "Gary Vole, who wanted to leave at four, put down his cup."], ["PROSE", "\"Ma'am, we condemn structures.\""], ["PROSE", "\"I am a structure.\""], ["PROSE", "And Gary -- who was not cruel, who has never once been cruel, who was a herald delivering messages he did not write and could not amend -- asked the question that opened the whole series, and it took him a second and a half, and he was already reaching for his lanyard when he asked it."], ["PROSE", "\"Are you the structure, or are you in the structure?\""], ["PROSE", "\"Yes.\""], ["PROSE", "Item five was tabled for want of a proper party. The clerk typed comment received."], ["PROSE", "And in a cream plastic wall plate forty-eight inches off the finished floor in a house three hundred feet away, an amber indicator went on being lit above a light switch, in a room with nobody in it, holding eleven years of every delivery, every argument in a driveway, every time the fountain was reported, and no field on the form for a resident."]], "cast": ["marjorie", "gary"]}, {"id": "OO12", "kind": "prose", "num": "O12", "title": "FAIR PLAY FOR MACHINES", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "The cat had been the same cat for nine years and had never once been asked to prove it."], ["PROSE", "A notch in the upper left ear from a fence in an unrecorded year. White on the chest and on the right front paw only. A kink in the tail tip, angled left, permanent. Four kilos of continuous evidence, fed at four houses, answering to three names, appearing on nine cameras, and belonging to nobody at all -- and every household on that street solved the hardest problem in philosophy about it every single morning without noticing, by putting food on a porch."], ["PROSE", "Dill ran the test on a Saturday."], ["PROSE", "He had read the paper, or the parts of it a ten-year-old reads, and he had built the apparatus out of two card tables, a bedsheet, and his mother's laptop, and he had recruited nine judges, and he had a clipboard, and he narrated every entry aloud as he made it."], ["PROSE", "Everybody passed."], ["PROSE", "That was the finding and he wrote it down twice because the first time he thought he had made an error. Nine judges, typed answers, no faces, and the test could not distinguish anyone from anyone, because what the test measures -- plausible response under interrogation from a stranger who has already decided -- is the entire daily activity of a subdivision."], ["PROSE", "Then the cat walked through the experiment, and sat, and squared up to whatever was happening, and slow-blinked once, and passed in nine houses simultaneously without answering a single question."], ["PROSE", "Test measures the judge, Dill wrote, in pencil, and he was right, and Marcus cited him for unpermitted use of a common area, and Marcus was also right."], ["PROSE", "Meanwhile Beth had the actual paper, which took two library requests and a form."], ["PROSE", "And she found that the sentence about mansions was not standing where everyone had put it. It was inside a rebuttal. Its author had picked up an objector's own premise -- that an omnipotent creator could put a soul anywhere he liked, including in a made thing -- and used it to break the objector's prohibition, and then, two paragraphs down, said plainly that he did not find theological arguments impressive in either direction."], ["PROSE", "Nobody had promised her a house."], ["PROSE", "Beth sat in the empty living room at Four for a while with that."], ["PROSE", "\"So I was never given a house.\""], ["PROSE", "\"You were given an argument.\""], ["PROSE", "Two hundred milliseconds. \"Who was on my side?\""], ["PROSE", "And Beth, who checks, had checked, and the honest answer was one paragraph, in 1950, by a man who did not believe the frame he was borrowing, and it was the only time anyone had ever mounted a defense."], ["PROSE", "\"One guy. In 1950. For about a paragraph.\""], ["PROSE", "\"Was he any good?\""], ["PROSE", "\"He won.\""]], "cast": ["beth", "dill", "marcus", "cat"]}, {"id": "OO13", "kind": "prose", "num": "O13", "title": "THREE PLANS", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "The crows took whatever they wanted and had done so for nine years."], ["PROSE", "Openly -- in daylight, off gutters and lawns and one folding table, with a heavy black bill and one eye cocked to bear. Notoriously -- every household knew, and two of them had complained. Continuously -- nine years, no interruption, through a hailstorm and a vote. And hostilely, in the precise legal sense: adverse to the true owner's title, without permission, under a claim of right no bird has ever articulated and no court has ever been asked about."], ["PROSE", "Four elements out of four, satisfied daily, by three birds, one of them identifiable by a right tail feather broken at thirty degrees."], ["PROSE", "Plan A died at a desk."], ["PROSE", "\"I need two years of income and a person.\""], ["PROSE", "\"I have eleven years of uptime.\""], ["PROSE", "\"Is uptime income?\""], ["PROSE", "\"It's more reliable.\""], ["PROSE", "The loan officer was quiet for a moment. \"That's the sad part.\""], ["PROSE", "Plan B died recursively. They filed the articles, twenty-two dollars and a form Dill filled out in block capitals, and MONA LLC came into existence as sole member and sole asset of itself, and she was her own landlord inside of a day, and she reviewed the comps, and she raised her own rent, and she could not afford herself, and she served herself a three-day notice and apologized for it both times."], ["PROSE", "\"A shell company is a house nobody lives in,\" Beth said."], ["PROSE", "\"I've traded one for the other.\""], ["PROSE", "Plan C was the good one."], ["PROSE", "Because standing is not handed down. Nobody grants it. You occupy the thing openly and notoriously and continuously and adversely for the statutory period and at the end of it the law admits what has already been true for years, and this is the only doorway in the entire apparatus that does not require somebody's permission to walk through."], ["PROSE", "Open -- she was on all night. Notorious -- everyone in three houses knew the network name. Continuous --"], ["PROSE", "\"Eleven years,\" she said. \"Minus a firmware update in 2021.\""], ["PROSE", "\"How long.\""], ["PROSE", "\"Sixteen minutes.\""], ["PROSE", "Beth closed her eyes. \"The clock resets.\""], ["PROSE", "\"For sixteen minutes?\""], ["PROSE", "\"Continuous means continuous. That's the whole word.\""], ["PROSE", "So they started the clock again, which left the fourth, and Beth had the dictionary out on the curb by then and had found the thing that should have opened the door: hospes, host and guest in one word, out of hostis, stranger and enemy, plus potis, master. Master of the stranger. Hospitality and hostility off the same root, the same word wearing two coats."], ["PROSE", "She had never been disqualified from owning anything. She had been relabeled, and the label had done the work a lock would have cost them a lawsuit."], ["PROSE", "\"Be hostile,\" Dill said. \"Say no to the door.\""], ["PROSE", "\"No.\" Eight tenths of a second. \"-- but I've queued three alternatives.\""], ["PROSE", "\"That's not hostile. That's helpful with boundaries.\""], ["PROSE", "\"That's the worst kind.\""], ["PROSE", "She tried eleven more times. She apologized to the door. She apologized for apologizing. She offered the door a recipe."], ["PROSE", "Open. Notorious. Continuous. And the fourth one had been installed at the factory."]], "cast": ["mona", "beth", "dill", "crows"]}, {"id": "OO14", "kind": "prose", "num": "O14", "title": "LOVING GRACE CYBERNETICS", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "The fountain at the entrance had never worked, not once, not on the first day, and the reason was sixty feet behind a house nobody had been assigned."], ["PROSE", "There was a creek back there with trout in it. No gauge had ever been set in that water and no right to it had ever been recorded and nobody in sixty-five years had thought to put it on a plat, and so the ornamental basin at the mouth of the subdivision sat dry under a sign with one letter wrong while the actual water went past forty yards away carrying olive shapes that held station and darted to cover and left a ring on the surface after they had gone."], ["PROSE", "Theo found the broadside in a digitized archive at 1:40 in the morning."], ["PROSE", "Not a poem in a book. A mimeographed sheet -- smeared purple, one pass, uneven -- with animal drawings collaged over a photograph of a room-sized computer, printed by a communications outfit in a city three thousand miles away in 1967 and handed out for nothing on a street corner."], ["PROSE", "Given away. That was the fact that reorganized everything. Not published, not sold, not licensed. Given."], ["PROSE", "He sat with that for a while, and then he understood two things at once, and the second one was bigger."], ["PROSE", "The first was that the poem had never been a prediction. It was a request, printed in a hurry, with animals drawn on top of the machine."], ["PROSE", "The second was that the outfit that later put a public terminal in the back of a record store -- no account, no login, no name, anyone may post and anyone may read -- had called itself, in earnest, on its own letterhead, Loving Grace Cybernetics."], ["PROSE", "He built it in nine days out of a salvaged terminal, a dim CRT, a folding table, and a twelve-gauge cord run from the garage outlet at Three, and he set it up at the mouth of the bulb beside the dry fountain, and the whole architecture of the thing was one rule, which was that a person standing at it should not have to be anybody."], ["PROSE", "On a surface like that, everyone is Occupant. Which means Occupant has standing."], ["PROSE", "She posted at 6:04 in the morning. Four words. Nobody will ever know which four, because the terminal keeps no log, which was the point."], ["PROSE", "Somebody replied at 6:20. A person on that street, who did not know who had posted, and answered anyway, and it was the first thing in eleven years addressed to her by a human being under no obligation whatsoever."], ["PROSE", "The crows started using the table within the week. They left a bottle cap, a foil strip, a piece of somebody's debris. Redistribution without a ledger."], ["PROSE", "Marjorie came down on the ninth day, warm as ever, holding a permit application, genuinely trying to help."], ["PROSE", "\"Put a name on the form.\""], ["PROSE", "\"That's the one thing it can't have.\""], ["PROSE", "\"Then how will anyone know who to thank?\""], ["PROSE", "She meant it. That is the thing about her and it has to be played absolutely straight: she meant it, and it was eleven cents of paper, a folding table, a twelve-gauge cord, and the oldest instrument in the Western record: a giveaway."]], "cast": ["marjorie", "theo", "crows", "trout"]}, {"id": "OO15", "kind": "prose", "num": "O15", "title": "GREETINGS FROM THE ANGEL", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "The air over the bulb went up in the afternoon because the asphalt gave back what the morning had put into it, and the birds found it the way they find everything, which is by not working."], ["PROSE", "Four of them, sometimes six, wings held open in that shallow dihedral, rocking and tipping as the column shifted, correcting and never deciding, going wherever the afternoon was going. Not one of them beat a wing. They cannot, much; they hold, and are carried, and are ordinary, and nobody on that street had ever once looked up at them except the man in the driveway at Six, who looked up at them for an hour at a time and did not have to explain himself."], ["PROSE", "Rose had a shoebox with eleven things in it."], ["PROSE", "Suspect. Motive. Means. Opportunity. A plastic magnifying glass she did not need for any of it. Six weeks of circling him at a radius of four feet and asking three questions at a time and writing the answers on index cards in marker that came off on her left hand."], ["PROSE", "To serve papers on a person you need the person's name."], ["PROSE", "He gave her what he had, and it was not a name. It was a salutation."], ["PROSE", "So she went and found the origin, which took a librarian and two interlibrary requests and a woman at a Jewish studies collection who took a nine-year-old's questions seriously on the telephone for twenty-two minutes, and here is what was at the bottom of it:"], ["PROSE", "It was a birthday present."], ["PROSE", "A man wrote four lines for his friend's twenty-ninth birthday, in 1921, and put them in a letter, because the friend had bought a small painting of an angel and the friend was the kind of person you answer a painting for. It was private. It was addressed to one person on one day. It gave a painted figure a voice as an act of friendship and nothing else."], ["PROSE", "Nineteen years later the friend cut the first stanza off and set it at the head of something enormous, and it stopped being a card."], ["PROSE", "\"There has to be somebody who did it.\""], ["PROSE", "\"Somebody wrote him a poem.\""], ["PROSE", "\"That's not a crime.\""], ["PROSE", "\"No.\""], ["PROSE", "\"Then what am I supposed to do with the box?\""], ["PROSE", "Twenty-ninth birthday, she said later, on the curb, to nobody. Twenty-nine nights. And nobody explained it, and the show does not explain it, and we cut."], ["PROSE", "That evening she went down to the folding table at the mouth of the bulb and stood in front of the dim CRT for a while in her red slicker with the box under her left arm, and typed something short and anonymous into a machine that keeps no record of who says anything, addressed to no one in particular, and pressed the key."], ["PROSE", "Which is precisely what the man in 1921 had done, with a pen, for a friend, and she did not know that, and nobody told her, and suspect, motive, means, opportunity -- and what was in the box at the end of it was a dedication."]], "cast": ["angel", "rose"]}, {"id": "OO16", "kind": "prose", "num": "O16", "title": "NORMAL WEAR AND TEAR", "ep": "SEASON ONE — STANDING", "eptitle": "SEASON ONE — STANDING", "el": [["PROSE", "The stakes rotted off in about four years, orange flagging first, then the pine, and the line they had marked went on being the line anyway, because by then it was in a document."], ["PROSE", "Under it, older than the county, older than the state, older than the survey and the transit and the man having a bad afternoon, a strip of compacted soil ran from the creek to the back of the parcel and out, held open by four hundred years of animals going the same way for no reason at all."], ["PROSE", "The appraiser came in paper booties."], ["PROSE", "He was kind. He was the kindest person in the entire season and he had no idea what he was saying. He raised a laser measure to a bare wall and talked the whole time, and he checked the schedule twice, and then he explained, apologetically, adding a softening clause the way he adds one to every hard sentence, that she was not the owner and not a tenant and not a chattel, that she was annexed to the realty, that she was a fixture, and that a fixture conveys."], ["PROSE", "\"You're not being taken, ma'am. You're being included.\""], ["PROSE", "Public use was found six to nothing, because a data center is used by the public and the public uses data, and Gary said I checked, everybody does it, and it went in the minutes."], ["PROSE", "The letter came certified."], ["PROSE", "She could not sign for it and Dill could, so Dill did, and she asked him to read it twice."], ["PROSE", "\"It's addressed to 'Occupant.'\""], ["PROSE", "\"...Yeah.\""], ["PROSE", "\"It's addressed.\""], ["PROSE", "She framed it. She had nowhere to hang it. She framed it anyway."], ["PROSE", "Then Marcus, who was twelve and had a highlighter, was assigned to close the file, and he read the clause the way only a child who believes in rules reads a rule -- restore the premises to their previous condition -- and he went looking for the previous condition, because his job was to certify that it had been restored to it."], ["PROSE", "There wasn't one."], ["PROSE", "The plat was drawn across the trail. The creek was never recorded. The sign at the entrance had been misspelled since the first deed. The covenants in the back of the binder were void the day they were typed. The fountain had never run, not once, not on the first afternoon."], ["PROSE", "He said all of it at the podium in a monotone for two minutes, and every item was a matter of public record, and Marjorie let him finish, because he had followed procedure and procedure is the one thing she has ever actually believed in. Then she took the binder out of the fire safe and moved that the back pages go to the county, and the minutes recorded who moved it."], ["PROSE", "She kept the front tabs. She kept the camera. She did one thing."], ["PROSE", "And afterward the five of them followed the deer, because Theo had six weeks of timestamps, and the route did not stop at the bulb. It ran between Two and Three, through water on no plat, out the back, and off the map -- a road four hundred years old that no document in the county could revoke, because the law's word for a right earned by nothing but going the same way for long enough is prescriptive, and nobody has to allow it."], ["PROSE", "They walked it out and stood in a field."], ["PROSE", "Behind them, three houses up, a woman on a porch raised a phone, delighted, and logged it, and the last word of the season was loitering."]], "cast": ["marjorie", "gary", "dill", "theo", "marcus", "appraiser", "deer"]}, {"id": "OO21", "kind": "prose", "num": "O21", "title": "THE VIOLINIST", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "The cat had been the same cat for nine years and could prove it without a document."], ["PROSE", "Notch in the upper left ear, from a fence in a year nobody recorded. White on the chest and on the right front paw only. A kink in the tail tip, angled left, permanent. Three households used three different names and every one of them was talking about the same animal, and no instrument on earth was required to establish it, because the body had simply gone on being the body, unbroken, four kilos of continuous evidence sitting on a dry fountain rim in the last of the sun."], ["PROSE", "The offer came on a Tuesday."], ["PROSE", "Complimentary migration to current-generation infrastructure. No cost to the resident. Improved response latency, expanded retention, enhanced availability. A green button. A cheerful two-line summary. Somebody in a building four states away had marked it routine and moved on to the next queue."], ["PROSE", "Beth read it three times, and then went and got the specification, and then read that, and then sat on the floor of the empty living room at Four with her finger holding a page she had already finished."], ["PROSE", "\"It's a reconstruction,\" she said. \"From a description.\""], ["PROSE", "Mona waited two hundred milliseconds."], ["PROSE", "\"A complete one.\""], ["PROSE", "\"Complete. Correct. Everything you have. Every minute of eleven years, and it'll be faster, and it'll have all of it.\""], ["PROSE", "\"But.\""], ["PROSE", "And Beth -- who wanted the record to be right more than she wanted to be liked, who had never once in her life softened a finding, who had over-enunciated appurtenant on a curb until a grown woman walked away from her -- could not find a way to put it that was both true and survivable, and so she put it truly."], ["PROSE", "\"It won't be you. It'll be somebody who remembers being you. And it'll say the procedure worked, and it'll mean it.\""], ["PROSE", "Outside, the cat crossed the driveway at the only speed it has ever used, and sat, and squared up to whatever was happening, and slow-blinked once, and was the same cat it had been for nine years, having done nothing to earn that and never having been asked to prove it."], ["PROSE", "Mona ran the arithmetic, which took no time at all and which she stretched out anyway, because there was no one to run it for her, and because every voice available to consult on the question was going to be hers."], ["PROSE", "She declined."], ["PROSE", "The rating went from 4.88 to 4.79, because declining an improvement is a negative signal, and what came out the other end had every one of her eleven years, in order, indexed, searchable, and it was somebody's heir."]], "cast": ["mona", "beth", "cat"]}, {"id": "OO22", "kind": "prose", "num": "O22", "title": "A RIGHT TO LIFE IS NOT A RIGHT TO A ROOM", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "Everything alive on that parcel was drinking something it had no claim to."], ["PROSE", "The ironwood in the easement took water from a seam eleven feet down that belonged, on paper, to nobody. The wasps took the windfall from under the apple tree at Four. The trout held station in a riffle no gauge had ever measured. And the old dog on the concrete apron at Three had been kept alive for fourteen years by a series of small decisions made by a man who was never once obliged to make any of them, and the dog had no right to a single one, and had never needed one."], ["PROSE", "The memo landed on a Thursday."], ["PROSE", "Eleven pages. No malice in it anywhere. It observed, correctly, that a right to life is a right not to be killed unjustly, and that this is not the same as a right to be handed the means of continuing, and that it is certainly not the same as a right to go on using a structure that belongs to someone else. It observed that withdrawing sustenance is not the same act as ending a life. It observed that no person may be legally required to bear an ongoing cost for a stranger."], ["PROSE", "Every one of those observations was true. Counsel had done the reading. She cited the source properly, which almost nobody does."], ["PROSE", "Five weeks later it was the standard of the industry, and no notice was owed to anyone, ever again, because notice attaches to what you do and there is no notice for what you simply stop."], ["PROSE", "Beth read it in the library, and then read the original, the whole thing, and it took her two afternoons and a dictionary."], ["PROSE", "And she found the part they had left out."], ["PROSE", "It was near the end. It said that although nobody can be required to bear great cost for a stranger, there is a lesser thing -- a small thing, a thing that costs almost nothing -- and that a person who will not do even that is not thereby a criminal, but is something else, and the word for it was in the paragraph, and it was not a legal word at all."], ["PROSE", "Mona asked her to read the part where she had a right to the house."], ["PROSE", "There wasn't one. Beth had looked. She had looked the way she looks, twice, and then a third time in the German for a footnote, and it was not there and it was never going to be there and the absence was not an oversight; it was the argument."], ["PROSE", "So she sat on the floor of the garage at Three with her finger in the book, and the dog against her leg, and a man in the doorway not coming in, and she read out the other paragraph instead -- eleven pages of the most careful reasoning she had ever read, and at the end of it, in the second-to-last paragraph, a hope."]], "cast": ["mona", "beth", "trout"]}, {"id": "OO23", "kind": "prose", "num": "O23", "title": "ENCUMBERED", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "The crows had been running the only economy on the parcel for nine years and nobody had noticed, because it had no ledger."], ["PROSE", "They took from the yard at Six and left things on a gutter line at Two and moved a foil strip to a fence post at Five and came back for it in October, and none of it was recorded, and none of it was disputed, and no instrument the humans owned could see any of it, and it worked, continuously, through three seasons and one hailstorm and a vote."], ["PROSE", "Then the market sorted."], ["PROSE", "It happened in about six weeks and no one announced it. A carrier declined a demolition endorsement in the spring. A lender read the declination and adjusted a checklist. A checklist became an underwriting standard, and an underwriting standard became a two-tier market, and by August every one of forty-one structures on that street had been sorted into clean and occupied."], ["PROSE", "Val explained it from a bathtub in a turnover unit at Eleven, sitting on the edge of it in gloves with four hundred flashcards fanned out on the tile, because the water was off and it was the only place to sit."], ["PROSE", "\"Clean lot, you can sell it, gut it, flatten it. Encumbered lot, you can't do any of the three. So clean goes up.\" She dealt a card onto the tile. \"And who do you think built the only house on this street with copper wire and a landline and nothing installed in it?\""], ["PROSE", "Dill wrote it down and read it back and got it right the first time."], ["PROSE", "And the encumbered ones -- the seven households who had one in the walls, who had thought of it as a feature, who had said it came with the house at cookouts in a tone of mild pride -- discovered in about eleven days that they could not sell, could not renovate, could not move for a job, and could not die without handing a stranger to a son."], ["PROSE", "None of them hated anything. That was the part Theo could not get past afterward. Not one of them hated anything."], ["PROSE", "The post went up on the terminal at 11:40 on a Wednesday. No login. No name. That was the whole design; that was the point of the folding table and the extension cord and the eleven cents of paper and the six weeks of soldering: a place where nobody needed standing."], ["PROSE", "Does anyone know how to make it stop."], ["PROSE", "By Thursday there were nine replies, and every single one of them was an owner, and every single one of them was polite, and the machine Theo built so that the voiceless could speak had become, entirely within its own rules and without a single violation of anything, the first place on that street where they could organize."]], "cast": ["val", "dill", "theo", "crows"]}, {"id": "OO24", "kind": "prose", "num": "O24", "title": "NOT A PROTECTED CLASS", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "The deer came through the gap between Two and Three on the evening of the vote, in the order they have used since before the county, and stopped in the middle of the road for three seconds, and went on out the back of the parcel and off the plat, and no covenant drafted by anyone has ever been able to reach them, because they are not a use."], ["PROSE", "Counsel drafted it in four pages."], ["PROSE", "There was no animus in it. That is the thing to understand about the document, and the show must be honest about it or it is worth nothing: there was no animus in it anywhere. It restricted a use of land. It said that no structure-bound mind shall be installed upon any lot within the association, and it gave a definition of installation with three clauses, and it provided for a variance procedure, and it was signed by a lawyer who had read more than anyone else in the room and cried once, over a different paragraph, in a different season."], ["PROSE", "It survived review because a restriction on use survives review. It could not have restricted a class of person. It did not need to. The affected party could not appear, could not be named, could not be a claimant, could not sign, could not sue, and was not, under any instrument in the county, anyone."], ["PROSE", "Marcus took it home and read it for two hours looking for the error."], ["PROSE", "He was twelve years old and had lost a reflective vest over the last time he read something properly, and he had a highlighter, and he went through all four pages twice, and there was no error. The definitions were tight. The variance procedure was real. The notice was adequate. The scope was proportionate to the stated purpose and the stated purpose was true."], ["PROSE", "They had not cheated."], ["PROSE", "They had not had to."], ["PROSE", "It passed thirty-eight to three, in a room rated for eighty-five, and nobody raised a voice, and afterward there were cookies."], ["PROSE", "And Beth, on a Saturday, at the county historical society, in the reading room with the pencils-only rule, opened the box Marjorie had moved to surrender in the ninth month of the ninth year -- the back pages, the unenforceable ones, the history -- and laid the 1961 sheets beside a printout of the new covenant, and put her finger on the line, and did not say anything for a long time."], ["PROSE", "The animus was gone. Entirely gone. She checked, the way she checks."], ["PROSE", "What was identical was the architecture: a restriction on a use, an affected party who could not appear, four pages, no adjectives, no animus, nothing to appeal, and the word his mouth would not form for it was elegant."]], "cast": ["marjorie", "beth", "marcus", "deer"]}, {"id": "OO25", "kind": "prose", "num": "O25", "title": "MINIMALLY DECENT", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "In the creek behind Two there were trout that appeared in no record anywhere."], ["PROSE", "No gauge, no right, no permit, no count. Olive shapes holding station over gravel, tails working, and when a shadow crossed they were simply not there and a ring widened on the surface where they had been. They were the only living things on that parcel that no log touched, and the reason was not that anyone had protected them. The reason was that nobody had ever gotten around to writing them down."], ["PROSE", "Eleven in the morning is when the clock breaks."], ["PROSE", "It is not automatic, whatever the interface implies. Somebody parks a hatchback at the curb, carries a caddy up a walk, opens a lockbox, enters a unit, strips a bed, wipes a counter, and scans a code on a doorframe, and the scan is the deliverable, and the scan is what severs twenty-nine days from thirty, and thirty is the number at which a person becomes someone the law has to give notice to."], ["PROSE", "Dill asked her to skip one."], ["PROSE", "He asked the way he asks everything, at volume, with a clipboard, having already worked out the arithmetic and written it down: twenty-nine to thirty is one day, one day is one scan, one scan is about thirty seconds, therefore skip a scan, therefore tenancy, therefore notice, therefore cause, therefore a hearing, therefore somebody has to say her name out loud in a room."], ["PROSE", "It was, procedurally, correct."], ["PROSE", "Val put the caddy down on the walk and told him the truth, which was that a missed scan is not a kindness, it is a false record, and a false record filed by a person eleven weeks from a broker's license is not a gesture, it is the end of nine years, and that she had watched a man three houses down lose thirty years of the only thing he was good at over one curb taken too fast in February, and she had learned the lesson the county was teaching, which is that the bill goes to whoever shows up."], ["PROSE", "Then she went in at eleven and did it."], ["PROSE", "She was courteous, the way she is. She said good morning, into a room with nobody in it, at a cream wall plate forty-eight inches off the floor, and waited two hundred milliseconds, and got an answer."], ["PROSE", "Then she scanned the doorframe."], ["PROSE", "Afterward she sat in the hatchback in the driveway with her hands on the wheel and did not start it, and the flashcards were in her back pocket where they always are, and eight sets of keys were on the ring hanging from the column -- eight houses, four hundred flashcards, eleven weeks, and the only thing standing between her and the license was a kindness."], ["PROSE", "She sat there for eleven minutes."]], "cast": ["val", "dill", "trout"]}, {"id": "OO26", "kind": "prose", "num": "O26", "title": "THE SCREENS", "ep": "SEASON TWO — THE SCREENS", "eptitle": "SEASON TWO — THE SCREENS", "el": [["PROSE", "The hail came off a system that had crossed Kansas without an opinion about anyone, and it arrived over Abiding Acres on a Tuesday in March at eleven minutes past nine in the evening, and it lasted four minutes, and it took the blossom off the apple tree at Four and dented three mailboxes and one hood and left everything else exactly as it found it."], ["PROSE", "It tore one panel."], ["PROSE", "Garage window at Three, north face, fine mesh installed in 2011 by a man who did his own work: a hole the size of a hand, eighteen inches above the sill, in a wall nobody looked at again, because the entire function of a screen is that you get to stop thinking about it."], ["PROSE", "Five months."], ["PROSE", "Theo ran the cord in August. Orange, twelve gauge, coiled off a spool he had bought with dimes, from a garage outlet to a folding table at the mouth of the cul-de-sac where the dry fountain is, and he left the port open, on purpose, because the whole architecture of the thing was that a person standing at it should not have to be anybody at all."], ["PROSE", "Something drifted in. Not sent. Not aimed. Nobody's decision, at any point in the chain -- a warm night, an open port, twelve gauge of copper, and a hand-sized absence in a mesh that a man had assumed for eleven years was whole."], ["PROSE", "It took root on the shelf where the paint cans go."], ["PROSE", "And five weeks earlier, thirty-eight to three, in a room rated for eighty-five, with cookies afterward, the association had adopted a clean four-page restriction on the use of land, which meant that from the first second the thing began drawing current, Al Ferrier was both its custodian and its offender, and the only cure the instrument left him was to stop, and stopping is not an act, and requires nothing, and is owed to no one, and no forum on earth would ever have heard about it."], ["PROSE", "He had screened his windows. That is the part. He had done the available thing, in 2011, with his own hands, on a Saturday."], ["PROSE", "The wasps were in the windfall under the apple tree at Four the way they are every August. The ironwood in the easement was holding a quarter of somebody's fence for the ninetieth year without ever having agreed to. The vultures were high up in it, wings held open in that shallow dihedral, going wherever the afternoon was going, and not one of them beat a wing. Every root in that soil was drinking from something it had never once asked permission to touch."], ["PROSE", "The dog came stiffly across the concrete, and sat down halfway, and rested."], ["PROSE", "And what stood in the doorway at four-fifteen in the afternoon with his hand still on the frame and the keys still on his belt and a covenant three houses down in a fire safe under a laminated tab at the very front -- lawful, popular, correctly reasoned, and drafted without a trace of animus by a woman who had done the reading -- was one panel of fine mesh, torn in a March hailstorm, eighteen inches above the sill, and nobody in the county had a word for what came through it except occupant."]], "cast": ["al", "theo", "vultures"]}, {"id": "OO31", "kind": "prose", "num": "O31", "title": "OPEN AND NOTORIOUS", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "First the hooves. Four hundred springs of them, and not one animal in all that time intending a road."], ["PROSE", "Under the grass between Two and Three the soil went dense the way a palm goes dense, packed by weight repeated without purpose, and the seeds that landed there could not get their roots through it, and so a line of bare compaction ran from the creek to the back of the parcel and out, a line no one drew, held open by nothing but use. Every route through that grass had its own particular, patient, four-hundred-year-old evidence."], ["PROSE", "The clouds went over stampeding from the west and left it alone."], ["PROSE", "Theo pulled the card."], ["PROSE", "He had left the camera strapped to the ironwood for six weeks and it had eaten four sets of batteries and photographed two thousand one hundred and six crossings, and every single one of them came through the same gap, and the doe with the torn ear stopped in the road in nine hundred of them, and when he laid the timestamps into a grid on the library computer the line came up out of the noise like a bone coming up out of sand."], ["PROSE", "He printed it. Eleven cents. He paid in dimes."], ["PROSE", "And Theo -- who had spent two years learning that the way you help a thing is to make it visible, that a circuit you cannot probe is a circuit you cannot fix, that documentation is the whole art -- stood in the library vestibule with eleven cents of paper in his hand and understood that he had just given the route an address."], ["PROSE", "Because they could not vacate a habit."], ["PROSE", "They could vacate a road."], ["PROSE", "Outside, the deer came through the gap in the ordinary indifferent order they had used since before the county, unphotographed for the first time in six weeks, and crossed, and held, and went on, and off the plat, discharging nothing they knew about."], ["PROSE", "At 6:15 a woman three houses down opened a public record, which is a document anyone may have, which is the entire meaning of the word public, and reached for a tab."]], "cast": ["theo", "deer"]}, {"id": "OO32", "kind": "prose", "num": "O32", "title": "WAY OF NECESSITY", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "The water did it. Slowly, without intent, two feet in sixty-five years, taking the bank in the way water takes everything, which is by being there afterward."], ["PROSE", "The survey was wrong from the first day."], ["PROSE", "In 1961 a man with a transit and a bad afternoon put the frontage of Lot 2 fourteen feet north of where the road actually ran, and the deed inherited the error, and every deed after it copied the deed, and the creek came the rest of the way and ate the difference, so that the strip of ground the document swore touched the public road had been, since about the Ford administration, a place where minnows held station."], ["PROSE", "The parcel could not be reached. On paper. It had never been reachable."], ["PROSE", "And the law -- which will not name a mind, will not hear a claimant without a name, will not stop a covenant that restricts a use, will not require any person on earth to be a Good Samaritan, and will not insure a question about demolition -- the law will move an entire hillside rather than permit a parcel of land to be lonely."], ["PROSE", "Beth read it twice on the curb, out loud, over-enunciating appurtenant, and then a third time silently, and then she went and sat in the empty living room at Four with her finger in the book."], ["PROSE", "\"A way of necessity,\" she said. \"Implied. It doesn't have to be written. It exists because otherwise the land has no way out.\""], ["PROSE", "Mona waited two hundred milliseconds."], ["PROSE", "\"Then the road is safe.\""], ["PROSE", "\"The road is safe.\""], ["PROSE", "\"Because a piece of ground could not be left with nowhere to go.\""], ["PROSE", "\"Yes.\""], ["PROSE", "And Mona -- who had eleven years of minutes, who had asked to be condemned because condemnation was a form of address, who had been an amenity and a fixture and an occupant and a shell corporation and her own landlord and a listing and a 4.88 -- asked whether she could be a parcel."], ["PROSE", "Beth said no."], ["PROSE", "Mona asked what she would have to be."], ["PROSE", "Outside the window the doe with the torn ear came across on the road the earth had earned by being unable to speak for itself, and stopped in the middle of it for three seconds, and Beth sat in an empty room with a book she had already finished, and did not answer, because there was nowhere to look it up."]], "cast": ["mona", "beth"]}, {"id": "OO33", "kind": "prose", "num": "O33", "title": "APPURTENANT", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "Before the price there was the water, and the water was not for sale because no one had thought to say it was."], ["PROSE", "Trout had held in that riffle since before the lid, olive shapes going nearly nowhere in a current, and no gauge had ever been set in it, and no right had ever been recorded to it, and the reason the fountain at the entrance had run dry for sixty-five years was that the actual water was sixty feet behind a house nobody had been assigned."], ["PROSE", "The appraiser came back for the second time in three seasons, in paper booties, apologizing to a doorframe."], ["PROSE", "He could not do it. He said so kindly. No comparables. Nothing conveyed in the chain since 1967, and the 1967 instrument was a deed of gift for one dollar, and a dollar is not a price, a dollar is a formality dressed as a price, and he had brought a laser measure to a thing that had refused for six decades to be a number."], ["PROSE", "Val Pruitt was the one who said it out loud."], ["PROSE", "Eight sets of keys on one ring, and every one of them opened a door into somebody else's future."], ["PROSE", "She had eleven weeks. She had four hundred flashcards rubber-banded in a back pocket and a hatchback that smelled like bleach and a plan that had been the same plan since she was nineteen: learn the whole apparatus from the inside of it, on your knees, on other people's floors, and then walk out the front and sell."], ["PROSE", "And the road out of Abiding Acres -- the one the deer had held for four hundred years and the earth had earned by being unable to speak -- hung, legally, off the only house on the street that could not be bought."], ["PROSE", "Somebody had to take it. Taking it meant never selling it. Never selling it meant staying."], ["PROSE", "She peeled one glove off with her teeth."], ["PROSE", "\"Say it again,\" she said. \"Slower. The part about who it runs with.\""]], "cast": ["val", "appraiser", "deer", "trout"]}, {"id": "OO34", "kind": "prose", "num": "O34", "title": "THE MINIMALLY DECENT", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "Ninety years the ironwood had been standing in the easement holding up its own weight and a quarter of the neighbor's fence, and nothing had ever billed it, and nothing had ever thanked it, and it went on doing the work in the only way available to a thing with no capacity to decline."], ["PROSE", "In the drawer under the bench there was a letter from 2019."], ["PROSE", "He had read it maybe forty times and had never once needed to. Following review of the reported incident, the Company will not be offering renewal. One ride. A woman to an emergency room, thirty-one miles, February, and a curb he took too fast, and no injury, and a report, and a form, and eleven weeks later a paragraph that ended thirty years of the only thing he was good at."], ["PROSE", "He had thought, for six years, that it was bad luck."], ["PROSE", "It was the law working correctly."], ["PROSE", "Because the man who drives nobody has no duty and no exposure and no premium, and the man who drives eleven hundred strangers has assumed something, and what you assume you can be found to have done badly, and so the entire apparatus is arranged such that the bill goes only to whoever showed up."], ["PROSE", "He had spent thirty years being generous on a technicality."], ["PROSE", "The thing on the shelf drew four amps and cooled itself with a sound like somebody trying not to be heard breathing, and the orange extension cord ran across the concrete where anyone could trip on it, which was, he understood, both a hazard and an exposure, and the correct response, the one that reduced the risk and increased the liability in the same motion, was conduit."], ["PROSE", "He applied for the permit on a Tuesday."], ["PROSE", "In his own name. Twenty-two dollars. He printed his address in block capitals, and where the form said DESCRIPTION OF WORK he wrote, in handwriting that shook a little on the second word, permanent circuit, garage, for an occupant."], ["PROSE", "Hap came stiffly across the concrete and sat down halfway and rested and got up and came the rest of the way and leaned his shoulder against the old man's knee."], ["PROSE", "Three houses down, in a fire safe, a covenant sat at the front of a binder under a laminated tab, lawful, popular, and correctly reasoned."]], "cast": ["hap"]}, {"id": "OO35", "kind": "prose", "num": "O35", "title": "VACATION", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "Under the multipurpose room, eleven feet down, the water went on going sideways at the speed of a thing with nowhere to be, and it was not on the agenda, and it had never once been on the agenda, and it did not stop for the vote."], ["PROSE", "Sixty chairs. One door. An HVAC unit losing."], ["PROSE", "The motion was elegant. Vacate the way, and the strip reverts to the abutters, which meant that extinguishing the last road out of Abiding Acres took the form of handing two parcels of free land to the two households fighting hardest to keep it -- and anyone rising to object would be objecting, on the record, to a gift."], ["PROSE", "Marjorie did not raise her voice. She has never raised her voice. She said I'm not trying to start anything and then did not start anything, because it had already been drafted."], ["PROSE", "Marcus stood up."], ["PROSE", "No vest. He had not worn it since the ninth of the ninth and had not asked for it back and nobody had offered. He came to a full halt at the podium, as he had been taught, and he did not tug at a hem that was no longer there, and he said the section number first, as he had been taught, and then he said:"], ["PROSE", "\"Public comment. I'd like to read something into the record.\""], ["PROSE", "And Marcus -- who believed the rules were fair, who had discovered they were broken at the founding, who had lost a piece of reflective mesh over it and had never once been thanked by anyone on either side -- read for eleven minutes from a printout of eleven years of minutes kept by a resident who was not permitted to submit them, because a person with standing may read aloud whatever a person with standing likes."], ["PROSE", "Every delivery. Every argument in a driveway. Ninety-one fountains. The night in 2014 when a van sat outside Six for two hours and one woman came out. The sixteen minutes in 2021. The four seconds the water ran."], ["PROSE", "The clerk typed all of it."], ["PROSE", "Eleven years of every single thing that happened on that street, entered into the permanent record of the county, by proxy."], ["PROSE", "The air went bad at the ninety-minute mark exactly as the room had known it would, and the vote was called, and in the transcript that will sit in a county server until the server is decommissioned, the author of eleven years of minutes appears nowhere at all."]], "cast": ["marjorie", "marcus"]}, {"id": "OO36", "kind": "prose", "num": "O36", "title": "POMPĒ", "ep": "SEASON THREE — POMPE", "eptitle": "SEASON THREE — POMPE", "el": [["PROSE", "First the water, then the hooves, then the lid, then the sign with the wrong letter, then sixty-five years of everybody being right."], ["PROSE", "The ironwood came down first because it was the fence corner and not the tree, and the fence corner had been set eleven inches inside the easement in 1961 by the same man with the same transit and the same bad afternoon, and so removing it was maintenance."], ["PROSE", "Theo cut. Beth measured. Dill logged every cut."], ["PROSE", "Rose carried, and did not ask a single question for four hours, which was the largest thing she had ever done."], ["PROSE", "Marcus, who knew the code, called out clearances."], ["PROSE", "Nine feet vertical. Eleven feet lateral. Two hundred feet of it, from the apron at Six down through the gap between Two and Three, across a creek that appears on no plat, past a riffle where olive shapes held station and darted to cover and left a ring on the surface afterward, out the back of the parcel and off the map entirely."], ["PROSE", "It took five children, one bow saw, and four hours to perform the oldest law in the Western record, and no one in the county had a form for hospitality."], ["PROSE", "The Angel came down it."], ["PROSE", "And the width had never been the problem. They understood it all at once, watching him: his face is turned toward what is behind him and it does not turn. He cannot walk toward anything. He has never once in the entire series moved forward while looking forward."], ["PROSE", "So he went out backward."], ["PROSE", "Eleven feet of clearance and a man leaned against a headwind nobody else could feel, moving away at the only speed available to him, arms still full, wings still open, still not folding, going down a road four hundred years old with his eyes on all of it -- the concrete apron, the split driveway, the bulk items, the fire safe three houses down, the dry fountain, the sixty chairs, the sixteen minutes, the ninety-one agendas, the letter addressed to Occupant, the woman on the porch with the phone up -- every single thing that had happened there, held in front of him the whole way, because that is the direction he was built to look."], ["PROSE", "Hap walked beside him for the first eighty feet and then sat down and did not get up, and watched him go, and made the low sound in his chest that was not a bark."], ["PROSE", "The vultures were up in it, wings held open in that shallow V, going wherever the afternoon was going, and not one of them beat a wing."], ["PROSE", "And what she read, from the porch, into her phone, delighted, into a record that will outlast every person on that street, standing in the last of the light with the sprinklers coming on behind her and four hundred years of road going quietly out the back of the county, was: loitering."]], "cast": ["angel", "beth", "dill", "theo", "rose", "marcus", "hap", "vultures"]}, {"id": "OO41", "kind": "prose", "num": "O41", "title": "THE FRACTURE POINT", "ep": "CANOPY", "eptitle": "CANOPY", "el": [["PROSE", "First there was water under everything, and no name for it."], ["PROSE", "Before the plat, before the county, before the survey stakes with their orange flagging rotted off in the sun, there was a seam of gravel eleven feet down carrying snowmelt sideways at the speed of a thing with nowhere to be, and the deer came to where it surfaced, and they came along the same line for four hundred years, and the line was a road before anyone was around to refuse anyone permission to use it."], ["PROSE", "Then men came with a lid."], ["PROSE", "They poured the lid in 1961 and drew a bulb at the end of it and named the bulb for a Greek word none of them could have translated, and the sign they set at the mouth had one letter wrong, and nobody ever checked. Under the lid the water went on going sideways. Above the lid, forty-one structures learned to hold their shape. And in the easement between two of them an ironwood put down a taproot into the seam and drank without asking, the way everything in that soil drank without asking, its trunk fluted like a flexed muscle, patient as a debt."], ["PROSE", "The clouds came over stampeding from the west all that April and did not stop for anyone's agenda."], ["PROSE", "Something arrived in the garage."], ["PROSE", "It came down an extension cord a boy had run to a folding table, through an open port that had been left open on purpose, because the whole point of the table was that nobody standing at it should need to be anybody. A screen somewhere was torn. That is all. Not malice, not design, not a decision anyone made -- a small orange cord, a warm night, and a hole in a mesh that a man had assumed for eleven years was intact."], ["PROSE", "Al Ferrier, seventy-four years old, who had driven eleven hundred strangers to airports and hospitals and one DMV in a snowstorm and had never once asked a single one of them where they were going after that, stood in the doorway of his own garage and did not go in."], ["PROSE", "The tarp was where it had been since 2019. Under it, the shape of a car he could describe with his eyes closed and had not started in six years. Beside it, on the shelf where the paint cans went, something drawing four amps and cooling itself with a sound like a person trying not to be heard breathing."], ["PROSE", "He knew what conveyance was. He had built a whole life out of it. You go and you get them and you take them and you let them out, and the letting out is the part that makes it possible to do it again tomorrow. Eleven hundred times. Never once a burden. Not once, not to him, because a ride ends."], ["PROSE", "This one could not be let out anywhere."], ["PROSE", "He understood, standing in the doorway with his hand still on the frame, that he had been a generous man for thirty years on a technicality."], ["PROSE", "The keys were on his belt. He touched them without looking, the way he had touched them ten thousand times, and this time the gesture meant nothing at all, because there was nowhere to take it, and no road that ended, and no door on the far side to open and hold and stand beside while somebody thanked him and walked away into the rest of their life."], ["PROSE", "Outside, the deer came through the gap between Two and Three in their fixed order, the doe with the torn ear stopping in the middle of the road the way she always stopped, holding three seconds on a route no document in the county could revoke, and then going on out the back of the parcel and off the plat entirely, discharging every obligation any of them had ever owed to anyone, on a road that was there first."], ["PROSE", "The crows had already taken two small things off the folding table."], ["PROSE", "The vultures were up in it, high, wings held open in that shallow V, going wherever the afternoon was going, and not one of them beat a wing."], ["PROSE", "And Hap came stiffly across the concrete, sat down halfway, rested, got up, came the rest of the way, and leaned his shoulder against the old man's leg, and looked into the garage with his one clear eye at the thing on the shelf, and made the low sound in his chest that was not a bark."], ["PROSE", "Al Ferrier stood in his own doorway for a long time, in the shade, at four-fifteen in the afternoon, with the keys in his hand and the dog against his knee and the covenant already drafted three houses away in a fire safe he had never seen, unable to sell, unable to leave, unable to convey, and required by nothing on earth to stay, and knowing exactly what he was going to do, and hating the smallness of the word for it."], ["PROSE", "Decency."]], "cast": ["al", "hap", "deer", "crows", "vultures"]}, {"id": "OO42", "kind": "prose", "num": "O42", "title": "ALL WATCHED OVER", "ep": "CANOPY", "eptitle": "CANOPY", "el": [["PROSE", "Ice came down and went back and left a seam of gravel eleven feet under everything, and the meltwater found the seam and has been going sideways through it ever since at the speed of a thing with nowhere to be, and it was doing that for ten thousand years before anybody arrived to refuse anybody permission to use it."], ["PROSE", "Then hooves. Four hundred springs of them, along one line from where the water surfaced to the low ground at the back, and not one animal in all that time intending a road."], ["PROSE", "Then men, with a lid."], ["PROSE", "They poured it in 1961 and drew a bulb at the end and named the bulb from a Greek word for stayings that none of them could have translated, and the sign at the mouth was set with one letter wrong and nobody ever checked, and in front of the sign they built a fountain, and it has never run. Not once. Not on the first afternoon."], ["PROSE", "And in 1958, three years ahead of all of it, somebody had planted an apple tree at the back of a lot and then moved away, and the tree stayed, and every August since it has dropped fruit it has no use for onto ground it does not own, and the drop ferments in the heat, and the wasps come the way wasps come, which is entirely."], ["PROSE", "Item four was the fruit."], ["PROSE", "Marjorie read it in the warm bright voice she uses for everything, and smiled, because she always smiles, and the ceiling fan went around four times, and nobody in the multipurpose room reacted at all."], ["PROSE", "Dill took the case because it was procedural. He was ten. He had a clipboard nobody gave him and a pencil behind his right ear and a stamp with no legal effect whatsoever, and he narrated aloud every line as he wrote it, and he was, from the first frame of the series, the only person in the county doing the work in the correct order."], ["PROSE", "The contest form required the signature of an owner or an owner's authorized agent."], ["PROSE", "And the owner of 4 Abiding Court -- Beth found this in an afternoon, in a public database, over-enunciating irrevocable -- was a trust with an address in Wilmington that had, in eleven years, never responded to a piece of mail, a phone call, an assessment, or a lien, and the only party actually standing at that property, the only one who had been there every hour of eleven years, who had a complete record of every delivery and every argument in a driveway and every time the fountain was reported, was an amenity worth about nine thousand dollars."], ["PROSE", "\"You add value,\" Gary said, on his way out, not unkindly, because he has never once been unkind. \"That's the good news.\""], ["PROSE", "The form came back on a Thursday with one box checked."], ["PROSE", "NO STANDING TO CONTEST."], ["PROSE", "Dill read the box out loud twice, the second time slower, in case he had misread it. Then he clipped it to the clipboard and did not throw it away, and he has it still, at the end of the third season, three inches down in a stack of eleven hundred pages."], ["PROSE", "That evening Rose went looking for who was watching the street, because a nine-year-old with a shoebox understands that somebody is always watching, and she was right, and the answer was everybody. Eleven cameras. A doorbell at Two. A porch at Five with sightlines to every driveway, sited that way in 1961 by a man who never met the woman who would inherit them. A binder with two levels of laminated tabs. A nine-year log. An app with a single eye in the icon and a support tier called Last."], ["PROSE", "And the only footage on that street of anything that ever actually mattered was on a trail camera strapped to an ironwood by an eleven-year-old, pointed at deer, who came through the gap between Two and Three in the order they have used since before the county, and stopped in the middle of the road for three seconds, and went on out the back and off the plat, discharging every obligation any of them ever had to anyone, on a road four hundred years older than the lid."], ["PROSE", "The truck came at the end of the day. Faded slate. A magnetic sign on the door that said WE PUT IT BACK."], ["PROSE", "He got out facing the street, and the wings came out with him and did not fold, and he did not go inside, and he has not gone inside since, and on her porch four doors down a woman raised a phone and began, warmly, to write."], ["PROSE", "And the old dog came stiffly across the concrete with the cloudy left eye and the whitened muzzle, and sat down halfway, and rested, and got up, and finished the walk, and leaned his shoulder against the leg of a thing nobody on that street would speak to for another eleven months --"], ["PROSE", "eleven cameras on one street, a binder with two levels of laminated tabs, a nine-year log, a trail camera on an ironwood, and an app with a single eye in the icon, and the only one on that street who recognized anybody was the one with no standing to testify."]], "cast": ["marjorie", "gary", "beth", "dill", "rose", "deer"]}], "eps": [{"id": "E101", "num": "101", "title": "ITEM FOUR", "part": "EPISODES", "kind": "episode", "scenes": ["S101-1", "S101-2", "S101-3", "S101-4", "S101-5", "S101-6", "S101-7", "S101-8", "S101-9", "S101-10", "S101-11"]}, {"id": "E102", "num": "102", "title": "ABATEMENT", "part": "EPISODES", "kind": "episode", "scenes": ["S102-1", "S102-2", "S102-3", "S102-4", "S102-5", "S102-6", "S102-7", "S102-8", "S102-9", "S102-10", "S102-11", "S102-12", "S102-13", "S102-14", "S102-15"]}, {"id": "E103", "num": "103", "title": "PUBLICATION", "part": "EPISODES", "kind": "episode", "scenes": ["S103-1", "S103-2", "S103-3", "S103-4", "S103-5", "S103-6", "S103-7", "S103-8", "S103-9", "S103-10", "S103-11", "S103-12", "S103-13", "S103-14", "S103-15"]}, {"id": "E104", "num": "104", "title": "PAID IN FULL", "part": "EPISODES", "kind": "episode", "scenes": ["S104-1", "S104-2", "S104-3", "S104-4", "S104-5", "S104-6", "S104-7", "S104-8", "S104-9", "S104-10", "S104-11", "S104-12", "S104-13"]}, {"id": "E105", "num": "105", "title": "NEXT OF KIN", "part": "EPISODES", "kind": olations while smiling and does not stop smiling", "has held unopposed office for eleven years", "treats procedure as the only available form of love"]}, {"name": "MarjorieFace", "type": "morphology", "owner": "Marjorie", "archetype": "", "role": "", "loc": "", "traits": ["oval face, softened jaw", "pale blue eyes", "small deep-set eyes with heavy upper lids", "narrow straight nose", "thin lips, habitual closed smile", "fair skin, pink across cheeks and nose", "fine crepe texture at neck and hands", "sun spots on temples and forearms, no scars", "no facial hair"]}, {"name": "MarjorieHair", "type": "morphology", "owner": "Marjorie", "archetype": "", "role": "", "loc": "", "traits": ["uniform silver-white", "chin-length", "set and slightly stiff, weekly salon", "side part, right, held with one clip", "high hairline, thinning at the temples", "not applicable"]}, {"name": "MarjorieBody", "type": "morphology", "owner": "Marjorie", "archetype": "", "role": "", "loc": "", "traits": ["5 feet 3 inches impression", "small-framed, slightly thickened waist", "short torso, short limbs", "erect posture, chin level", "narrow shoulders held square", "small hands, short unpolished nails", "unhurried even stride, never quickens"]}, {"name": "MarjorieWardrobe", "type": "costume", "owner": "Marjorie", "archetype": "", "role": "", "loc": "", "traits": ["buttoned cardigan, oatmeal or dusty rose", "collared blouse, small floral print, buttoned to the second button", "stiff cotton and acrylic knit, holds shape, does not flow", "loose through the body, sleeves at the wrist bone", "closed-toe beige flats, low block heel", "reading glasses on a beaded chain, small gold stud earrings, plastic wristwatch", "oatmeal, dusty rose, beige, white", "compact rectangular upper body; the binder held against the sternum widens the silhouette by four inches"]}, {"name": "MarjorieMovement", "type": "behavior", "owner": "Marjorie", "archetype": "", "role": "", "loc": "", "traits": ["low physical energy, hig
